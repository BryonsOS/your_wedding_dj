      <button className="btn b-out" onClick={()=>setExtra(x=>({...x,packages:[...x.packages,{...blankPkg,id:uid()}]}))}>+ Add Package</button>
    </div>
    {pk.map(r=>(
      <div key={r.id} className="card" style={{padding:"16px",marginBottom:"10px",opacity:val(r,"active")?1:.55}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",gap:"10px",marginBottom:"10px"}}>
          <div className="fg"><label className="lbl">Name</label><input style={inp} value={val(r,"name")} onChange={e=>set(r,"name",e.target.value)}/></div>
          <div className="fg"><label className="lbl">Price</label><input style={inp} type="number" value={val(r,"price")} onChange={e=>set(r,"price",e.target.value)}/></div>
          <div className="fg"><label className="lbl">Hours</label><input style={inp} type="number" step="0.5" value={val(r,"hours")} onChange={e=>set(r,"hours",e.target.value)}/></div>
          <div className="fg"><label className="lbl">Overtime /hr</label><input style={inp} type="number" value={val(r,"overtime_rate")} onChange={e=>set(r,"overtime_rate",e.target.value)}/></div>
          <div className="fg"><label className="lbl">Deposit</label><input style={inp} type="number" value={val(r,"deposit")} onChange={e=>set(r,"deposit",e.target.value)}/></div>
        </div>
        <div className="fg" style={{marginBottom:"10px"}}><label className="lbl">What's included (one per line — clients see this)</label><textarea value={val(r,"includes")} onChange={e=>set(r,"includes",e.target.value)} style={{minHeight:"70px",fontSize:"13px"}}/></div>
        <div style={{display:"flex",alignItems:"center",gap:"10px",justifyContent:"flex-end"}}>
          <span style={{fontSize:"12px",color:"var(--muted)"}}>Active</span><Toggle on={!!val(r,"active")} set={v=>set(r,"active",v)}/>
          <button className="btn b-gold" disabled={!dirty(r)||busy===r.id} onClick={()=>save("dj_packages",r)} style={{padding:"7px 16px",fontSize:"12px"}}>{busy===r.id?"Saving…":"Save"}</button>
        </div>
      </div>
    ))}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"26px 0 12px",flexWrap:"wrap",gap:"10px"}}>
      <h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)"}}>Add-ons</h3>
      <button className="btn b-out" onClick={()=>setExtra(x=>({...x,addons:[...x.addons,{...blankAdd,id:uid()}]}))}>+ Add Add-on</button>
    </div>
    <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px"}}><div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 110px 2.4fr 110px 70px 80px",gap:"10px",padding:"10px 14px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>{["Name","Price","Description","Per (e.g. hour)","Active",""].map(h=><div key={h} className="lbl" style={{margin:0}}>{h}</div>)}</div>
      {ad.map(r=>(
        <div key={r.id} style={{display:"grid",gridTemplateColumns:"2fr 110px 2.4fr 110px 70px 80px",gap:"10px",padding:"8px 14px",borderBottom:"1px solid var(--border)",alignItems:"center",opacity:val(r,"active")?1:.55}}>
          <input style={inp} value={val(r,"name")} onChange={e=>set(r,"name",e.target.value)}/>
          <input style={inp} type="number" value={val(r,"price")} onChange={e=>set(r,"price",e.target.value)}/>
          <input style={inp} value={val(r,"description")} onChange={e=>set(r,"description",e.target.value)}/>
          <input style={inp} value={val(r,"per_unit")} onChange={e=>set(r,"per_unit",e.target.value)} placeholder="—"/>
          <Toggle on={!!val(r,"active")} set={v=>set(r,"active",v)}/>
          <button className="btn b-gold" disabled={!dirty(r)||busy===r.id} onClick={()=>save("dj_addons",r)} style={{padding:"6px 12px",fontSize:"12px"}}>{busy===r.id?"…":"Save"}</button>
        </div>
      ))}
    </div></div>
  </div>);
}

// ════════════════════════════════════════════════
// LEADS (quote requests from the public website)
// ════════════════════════════════════════════════
const LEAD_TYPES={"Wedding":"wedding","School Dance / Prom":"school_dance","Birthday Party":"birthday","Sweet 16 / Quinceañera":"sweet_16","Corporate Event":"corporate","Bar / Bat Mitzvah":"bar_mitzvah","Other":"other"};
const LEAD_STATUS=[["new","New"],["contacted","Contacted"],["quoted","Quoted"],["booked","Booked"],["lost","Lost"]];
// Passwords set during this admin session, so the email templates can include them (they can never be read back from the database)
const SESSION_PW={};
const tempPassword=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";const a=crypto.getRandomValues(new Uint8Array(10));return Array.from(a,x=>c[x%c.length]).join("");};
// Turn a website lead into a pre-filled event for the admin event form
function leadToEvent(l,catalog){
  const type=LEAD_TYPES[l.event_type]||"other";
  const d={eventType:type,eventName:`${l.name} — ${meta(type).label}`,eventDate:l.event_date||"",clientName:l.name||"",email:l.email||"",phone:l.phone||"",
    guestCount:l.guest_count?String(l.guest_count):"",venueName:l.venue||"",specialRequests:l.message||"",timeline:(TL[type]||[]).map(x=>({label:x,time:"",note:""}))};
  const p=(catalog?.packages||[]).find(x=>x.name===l.package_interest);
  if(p){Object.assign(d,{packageId:p.id,packageName:p.name,packagePrice:str(p.price),packageHours:str(p.hours),overtimeRate:str(p.overtime_rate),depositAmount:str(p.deposit)});d.totalAmount=String(linesTotal(priceLines(d)));}
  return d;
}

function LeadsPanel({leads,allEvents,onUpdate,onConvert}){
  const[filter,setFilter]=useState("open");
  const[notes,setNotes]=useState({});
  const booked=new Set(allEvents.filter(e=>["confirmed","submitted"].includes(e.status)).map(e=>e.eventDate));
  const list=leads.filter(l=>filter==="all"||(filter==="open"?!["booked","lost"].includes(l.status):l.status===filter));
  const reply=l=>`mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent(`Your ${l.event_type||"event"} on ${l.event_date?fShort(l.event_date):"your date"} — YourWeddingsDJ.com`)}&body=${encodeURIComponent(`Hi ${(l.name||"").split(" ")[0]||"there"},\n\nThanks for reaching out about your ${(l.event_type||"event").toLowerCase()}${l.event_date?` on ${fDate(l.event_date)}`:""}! ${l.event_date&&booked.has(l.event_date)?"Unfortunately that date is already booked, but I'd be happy to recommend options.":"Good news — that date is currently open."}\n\n\n\nThanks,\nBryon\nYourWeddingsDJ.com — a Directmix Entertainment company\n(248) 390-4576 · bryon@yourweddingsdj.com`)}`;
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"12px",flexWrap:"wrap",marginBottom:"16px"}}>
      <div><h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)"}}>Website Leads</h3><p style={{fontSize:"13px",color:"var(--muted)"}}>Quote requests from yourweddingsdj.com. Turn one into a client and event in two clicks.</p></div>
      <select value={filter} onChange={e=>setFilter(e.target.value)} style={{width:"170px"}}><option value="open">Open leads</option><option value="all">All leads</option>{LEAD_STATUS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
    </div>
    {list.length===0&&<div style={{textAlign:"center",padding:"48px 24px",background:"var(--white)",borderRadius:"12px",border:"1.5px solid var(--border)",color:"var(--muted)",fontSize:"14px"}}>No leads here yet. Quote requests from the website will show up here.</div>}
    <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
      {list.map(l=>{const taken=l.event_date&&booked.has(l.event_date);return(
        <div key={l.id} className="card" style={{padding:"18px 20px",borderColor:l.status==="new"?"rgba(255,255,255,.35)":"var(--border)"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:"12px",flexWrap:"wrap",marginBottom:"10px"}}>
            <div>
              <div style={{fontFamily:"var(--ff)",fontSize:"19px",color:"var(--ink)"}}>{l.name} {l.status==="new"&&<span className="badge st-submitted" style={{marginLeft:"6px",verticalAlign:"middle"}}>New</span>}</div>
              <div style={{fontSize:"12px",color:"var(--muted)"}}>Received {new Date(l.created_at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}{l.source?` · Found us via ${l.source}`:""}</div>
            </div>
            <select value={l.status} onChange={e=>onUpdate(l.id,{status:e.target.value})} style={{width:"150px"}}>{LEAD_STATUS.map(([v,t])=><option key={v} value={v}>{t}</option>)}</select>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"6px 18px",fontSize:"13px",marginBottom:"10px"}}>
            <div><span className="lbl" style={{display:"inline"}}>Event </span>{l.event_type||"—"}</div>
            <div><span className="lbl" style={{display:"inline"}}>Date </span>{l.event_date?fShort(l.event_date):"—"} {l.event_date&&<span style={{fontSize:"11px",fontWeight:700,color:taken?"var(--red)":"var(--green)"}}>{taken?"· BOOKED":"· OPEN"}</span>}</div>
            <div><span className="lbl" style={{display:"inline"}}>Guests </span>{l.guest_count||"—"}</div>
            <div><span className="lbl" style={{display:"inline"}}>Venue </span>{l.venue||"—"}</div>
            <div><span className="lbl" style={{display:"inline"}}>Package </span>{l.package_interest||"—"}</div>
            <div><a href={`mailto:${l.email}`} style={{color:"var(--blue)"}}>{l.email}</a>{l.phone&&<> · <a href={`tel:${l.phone}`} style={{color:"var(--blue)"}}>{l.phone}</a></>}</div>
          </div>
          {l.message&&<p style={{fontSize:"13.5px",color:"var(--body)",background:"var(--panel)",borderRadius:"8px",padding:"10px 12px",marginBottom:"10px",whiteSpace:"pre-wrap"}}>{l.message}</p>}
          <textarea value={notes[l.id]??l.notes??""} onChange={e=>setNotes(n=>({...n,[l.id]:e.target.value}))} onBlur={()=>{if(notes[l.id]!==undefined&&notes[l.id]!==(l.notes||""))onUpdate(l.id,{notes:notes[l.id]});}} placeholder="Private notes (saved when you click away)…" style={{minHeight:"44px",fontSize:"13px",marginBottom:"10px"}}/>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            <button className="btn b-gold" onClick={()=>onConvert(l)} style={{padding:"7px 14px",fontSize:"12.5px"}}>Create Client &amp; Event</button>
            <a className="btn b-out" href={reply(l)} style={{padding:"7px 14px",fontSize:"12.5px",textDecoration:"none"}} onClick={()=>{if(l.status==="new")onUpdate(l.id,{status:"contacted"});}}>✉️ Reply</a>
          </div>
        </div>);})}
    </div>
  </div>);
}

// PayToggle — must live OUTSIDE AdminDashboard so inputs don't reset on every keystroke
function PayToggle({id,label,icon,desc,field,placeholder,lps,setLps,setPdirty}){
  const on=lps.methods?.[id];
  return(
    <div className={`pm${on?" on":""}`}>
      <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:on?"14px":"0"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:"14px",fontWeight:600,color:"var(--ink)"}}>{label}</div>
          <div style={{fontSize:"12px",color:"var(--muted)"}}>{desc}</div>
        </div>
        <Toggle on={!!on} set={v=>{setLps(p=>({...p,methods:{...p.methods,[id]:v}}));setPdirty(true);}}/>
      </div>
      {on&&(
        <div style={{paddingTop:"12px",borderTop:"1px solid var(--gbdr)"}}>
          <div className="fg">
            <label className="lbl">{label} Handle / Info</label>
            <input
              value={lps[field]||""}
              onChange={e=>{const v=e.target.value;setLps(p=>({...p,[field]:v}));setPdirty(true);}}
              placeholder={placeholder}
            />
          </div>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════
// ADMIN DASHBOARD
// ════════════════════════════════════════════════
function AdminDashboard({allEvents,profiles,paySettings,payRequests,payments,catalog,leads,onUpdateLead,onSaveCatalog,onSelectEvent,onNewEvent,onSavePaySettings,onAddClient,onLogout}){
  const clients=profiles.filter(p=>!p.is_admin);
  const[tab,setTab]=useState("calendar");
  const[filter,setFilter]=useState({status:"all",type:"all",search:"",uid:"all"});
  const[lps,setLps]=useState(paySettings||BLANK_PAY);
  const[pdirty,setPdirty]=useState(false);
  const[psaving,setPsaving]=useState(false);
  const[cmodal,setCmodal]=useState(false);
  const[credmodal,setCredmodal]=useState(null);
  const[convLead,setConvLead]=useState(null); // website lead being turned into a client
  const newLeads=(leads||[]).filter(l=>l.status==="new").length;
  const convert=l=>{
    const existing=profiles.find(p=>(p.email||"").toLowerCase()===(l.email||"").toLowerCase());
    if(existing){onNewEvent(existing.id,leadToEvent(l,catalog));return;} // already a client: go straight to the event
    setConvLead(l);setCf({name:l.name||"",email:l.email||"",password:tempPassword()});setCfErr("");setTab("clients");setCmodal(true);
  };
  const[cf,setCf]=useState({name:"",email:"",password:""});
  const[cfErr,setCfErr]=useState("");

  const today=new Date().toISOString().slice(0,10);
  const counts={total:allEvents.length,upcoming:allEvents.filter(e=>e.eventDate>=today).length,confirmed:allEvents.filter(e=>e.status==="confirmed").length,submitted:allEvents.filter(e=>e.status==="submitted").length,clients:clients.length};

  const filtered=allEvents.filter(ev=>{
    if(filter.status!=="all"&&ev.status!==filter.status)return false;
    if(filter.type!=="all"&&ev.eventType!==filter.type)return false;
    if(filter.uid!=="all"&&ev.userId!==filter.uid)return false;
    if(filter.search){const q=filter.search.toLowerCase();if(!`${ev.eventName} ${ev.clientName} ${ev.venueName}`.toLowerCase().includes(q))return false;}
    return true;
  });

  const SBox=({l,v,bg,c})=><div style={{background:bg,borderRadius:"10px",padding:"16px 20px"}}><div style={{fontSize:"26px",fontWeight:700,color:c,fontFamily:"var(--ff)"}}>{v}</div><div style={{fontSize:"11px",color:c,opacity:.8,fontWeight:600,textTransform:"uppercase",letterSpacing:".07em",marginTop:"2px"}}>{l}</div></div>;
  const cText=(name,email,pw)=>`Hi ${name},\n\nYour ${BRAND} event planning portal account is ready.\n\nLogin URL: ${PORTAL}\nEmail: ${email}\nPassword: ${pw}\n\nLog in to start planning your event.`;

  const handleAddClient=async()=>{
    if(!cf.name.trim()||!cf.email.trim()||!cf.password.trim()){setCfErr("All fields are required.");return;}
    if(cf.password.length<6){setCfErr("Password must be at least 6 characters.");return;}
    const r=await onAddClient(cf.name,cf.email,cf.password);
    if(typeof r==="string"){setCfErr(r);return;}
    if(r?.id)SESSION_PW[r.id]=cf.password;
    setCredmodal({name:cf.name,email:cf.email,password:cf.password,id:r?.id,lead:convLead});
    if(convLead&&convLead.status==="new")onUpdateLead(convLead.id,{status:"contacted"});
    setConvLead(null);
    setCmodal(false);setCf({name:"",email:"",password:""});setCfErr("");
  };

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <header style={{background:"var(--nav)",padding:"0 28px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.28)"}}>
      <div style={{maxWidth:"1200px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:"60px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}><img src={LOGO+"wordmark-white.svg"} alt={BRAND} style={{height:"22px",width:"auto",display:"block"}}/><span className="adm">Admin</span></div>
        <button className="btn b-nav" onClick={onLogout} style={{padding:"6px 12px",fontSize:"12.5px"}}>Sign Out</button>
      </div>
    </header>
    <main style={{maxWidth:"1200px",margin:"0 auto",padding:"32px 28px"}}>
      <div style={{marginBottom:"22px",display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:"14px",flexWrap:"wrap"}}>
        <div><h1 style={{fontFamily:"var(--ff)",fontSize:"28px",fontWeight:400,color:"var(--ink)",marginBottom:"4px"}}>Admin Dashboard</h1><p style={{fontSize:"13px",color:"var(--muted)"}}>Manage clients, events, and payments from one place.</p></div>
        <div style={{display:"flex",gap:"10px"}}>
          <button className="btn b-out" onClick={()=>{setTab("clients");setCf({name:"",email:"",password:""});setCfErr("");setCmodal(true);}}>+ Add Client</button>
          <button className="btn b-gold" onClick={()=>onNewEvent(null)}>+ New Event</button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:"10px",marginBottom:"26px"}}>
        <SBox l="Total Events" v={counts.total}    bg="var(--panel)"   c="var(--ink)"/>
        <SBox l="Upcoming"    v={counts.upcoming}  bg="var(--gbg)"  c="var(--gold)"/>
        <SBox l="Confirmed"   v={counts.confirmed} bg="var(--gbg2)" c="var(--green)"/>
        <SBox l="Submitted"   v={counts.submitted} bg="var(--bbg)"  c="var(--blue)"/>
        <SBox l="Clients"     v={counts.clients}   bg="var(--pbg)"  c="var(--purple)"/>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"2px solid var(--border)",marginBottom:"22px",overflowX:"auto"}}>
        {[["calendar","Calendar"],["leads",`Leads${newLeads?` (${newLeads})`:""}`],["list","Events"],["clients","Clients"],["payments","Payments"],["packages","Packages"]].map(([t,l])=>(
          <button key={t} className={`tab ${tab===t?"on":"off"}`} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* Calendar tab */}
      {tab==="calendar"&&<div className="card" style={{padding:"24px"}}><CalendarView events={allEvents} onSelect={onSelectEvent}/></div>}
      {tab==="packages"&&<CatalogEditor catalog={catalog} onSave={onSaveCatalog}/>}
      {tab==="leads"&&<LeadsPanel leads={leads||[]} allEvents={allEvents} onUpdate={onUpdateLead} onConvert={convert}/>}

      {/* Events list tab */}
      {tab==="list"&&<div>
        <div style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
          <input value={filter.search} onChange={e=>setFilter(f=>({...f,search:e.target.value}))} placeholder="Search events…" style={{flex:1,minWidth:"180px",maxWidth:"280px"}}/>
          <select value={filter.status} onChange={e=>setFilter(f=>({...f,status:e.target.value}))} style={{width:"150px"}}><option value="all">All Statuses</option><option value="draft">Draft</option><option value="submitted">Submitted</option><option value="confirmed">Confirmed</option></select>
          <select value={filter.type} onChange={e=>setFilter(f=>({...f,type:e.target.value}))} style={{width:"180px"}}><option value="all">All Event Types</option>{ET.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <select value={filter.uid} onChange={e=>setFilter(f=>({...f,uid:e.target.value}))} style={{width:"200px"}}><option value="all">All Clients</option>{clients.map(p=><option key={p.id} value={p.id}>{p.name||p.email}</option>)}</select>
        </div>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"48px 24px",background:"var(--white)",borderRadius:"12px",border:"1.5px solid var(--border)",color:"var(--muted)"}}><p style={{fontSize:"15px",color:"var(--ink)"}}>No events match your filters.</p></div>
        ):(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.2fr 1fr 1fr 80px",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>
              {["Event","Client","Date","Venue","Status",""].map((h,i)=><div key={i} style={{fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:"var(--muted)"}}>{h}</div>)}
            </div>
            {filtered.map((ev,i)=>{const m2=meta(ev.eventType);const owner=profiles.find(p=>p.id===ev.userId);return(
              <div key={ev.id} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.2fr 1fr 1fr 80px",gap:"12px",padding:"13px 18px",borderBottom:i<filtered.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="var(--panel)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}
                onClick={()=>onSelectEvent(ev)}>
                <div style={{display:"flex",alignItems:"center",gap:"7px"}}><span style={{fontSize:"15px"}}>{m2.e}</span><div><div style={{fontSize:"13.5px",fontWeight:500,color:"var(--ink)"}}>{ev.eventName||"Unnamed"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{m2.label}</div></div></div>
                <div><div style={{fontSize:"13px",color:"var(--ink)"}}>{ev.clientName||owner?.name||"—"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{ev.email||owner?.email||""}</div></div>
                <div style={{fontSize:"13px",color:"var(--body)"}}>{ev.eventDate?fShort(ev.eventDate):"—"}{ev.startTime&&<div style={{fontSize:"11px",color:"var(--muted)"}}>{f12(ev.startTime)}</div>}</div>
                <div style={{fontSize:"12.5px",color:"var(--body)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.venueName||"—"}{ev.venueCity&&<div style={{fontSize:"11px",color:"var(--muted)"}}>{ev.venueCity}</div>}</div>
                <div><span className={`badge st-${ev.status||"draft"}`}>{ev.status||"draft"}</span></div>
                <button className="btn b-gold" onClick={e=>{e.stopPropagation();onSelectEvent(ev);}} style={{padding:"5px 12px",fontSize:"12px"}}>Open</button>
              </div>
            );})}
          </div></div>
        )}
      </div>}

      {/* Clients tab */}
      {tab==="clients"&&<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
          <div><h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)",marginBottom:"2px"}}>Client Accounts</h3><p style={{fontSize:"13px",color:"var(--muted)"}}>Create accounts and send login credentials to clients.</p></div>
          <button className="btn b-gold" onClick={()=>{setCf({name:"",email:"",password:""});setCfErr("");setCmodal(true);}} style={{padding:"9px 20px"}}>+ Add Client</button>
        </div>
        {clients.length===0?(
          <div style={{textAlign:"center",padding:"48px 24px",background:"var(--white)",borderRadius:"12px",border:"1.5px solid var(--border)",color:"var(--muted)"}}><p style={{fontFamily:"var(--ff)",fontSize:"18px",color:"var(--ink)",marginBottom:"6px"}}>No clients yet</p><button className="btn b-gold" onClick={()=>{setCf({name:"",email:"",password:""});setCfErr("");setCmodal(true);}}>Add First Client</button></div>
        ):(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 2fr 80px 300px",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>
              {["Name","Email","Events","Actions"].map(h=><div key={h} style={{fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:"var(--muted)"}}>{h}</div>)}
            </div>
            {clients.map((p,i)=>(
              <div key={p.id} style={{display:"grid",gridTemplateColumns:"2fr 2fr 80px 300px",gap:"12px",padding:"13px 18px",borderBottom:i<clients.length-1?"1px solid var(--border)":"none",alignItems:"center"}}>
                <div style={{fontWeight:500,color:"var(--ink)",fontSize:"13.5px"}}>{p.name||"—"}</div>
                <div style={{fontSize:"13px",color:"var(--body)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.email}</div>
                <div style={{fontSize:"13px",color:"var(--blue)",fontWeight:600}}>{allEvents.filter(e=>e.userId===p.id).length}</div>
                <div style={{display:"flex",gap:"6px"}}>
                  <button className="btn b-out" onClick={()=>{setFilter(f=>({...f,uid:p.id,status:"all",type:"all",search:""}));setTab("list");}} style={{padding:"5px 10px",fontSize:"11px"}}>View Events</button>
                  <button className="btn b-out" onClick={()=>onNewEvent(p.id)} style={{padding:"5px 10px",fontSize:"11px"}}>+ Event</button>
                  <button className="btn b-out" onClick={()=>setCredmodal({name:p.name||"Client",email:p.email,password:SESSION_PW[p.id]||"(as set)",id:p.id})} style={{padding:"5px 10px",fontSize:"11px"}}>Send Credentials</button>
                </div>
              </div>
            ))}
          </div></div>
        )}
        {/* Add client modal */}
        {cmodal&&<Modal close={()=>setCmodal(false)} w={440}>
          <h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)",marginBottom:"16px"}}>Add New Client</h3>
          <ErrBox msg={cfErr}/>
          <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
            <div className="fg"><label className="lbl">Full Name</label><input value={cf.name} onChange={e=>setCf(f=>({...f,name:e.target.value}))} placeholder="Client's full name"/></div>
            <div className="fg"><label className="lbl">Email Address</label><input type="email" value={cf.email} onChange={e=>setCf(f=>({...f,email:e.target.value}))} placeholder="client@email.com"/></div>
            <div className="fg"><label className="lbl">Temporary Password</label><input type="text" value={cf.password} onChange={e=>setCf(f=>({...f,password:e.target.value}))} placeholder="Set a temporary password"/><p style={{fontSize:"11px",color:"var(--muted)",marginTop:"2px"}}>You'll share this with them — they can change it after logging in.</p></div>
            <div style={{display:"flex",gap:"10px",marginTop:"4px"}}><button className="btn b-out" onClick={()=>{setCmodal(false);setConvLead(null);}} style={{flex:1,justifyContent:"center"}}>Cancel</button><button className="btn b-gold" onClick={handleAddClient} style={{flex:1,justifyContent:"center"}}>Create Account</button></div>
          </div>
        </Modal>}
        {/* Credentials modal */}
        {credmodal&&<Modal close={()=>setCredmodal(null)} w={520}>
          <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"18px"}}><h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)"}}>Login Credentials</h3></div>
          <div style={{background:"var(--panel)",border:"1.5px solid var(--border)",borderRadius:"10px",padding:"16px 18px",marginBottom:"18px",fontFamily:"monospace",fontSize:"13px",color:"var(--ink)",lineHeight:1.9}}>
            <div><span style={{color:"var(--muted)"}}>Portal URL:</span> <strong>{PORTAL}</strong></div>
            <div><span style={{color:"var(--muted)"}}>Email:</span>      <strong>{credmodal.email}</strong></div>
            <div><span style={{color:"var(--muted)"}}>Password:</span>   <strong>{credmodal.password}</strong></div>
          </div>
          <p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"18px",lineHeight:1.6}}>Share these with <strong style={{color:"var(--ink)"}}>{credmodal.name}</strong> so they can log in and start planning their event.</p>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
            <CopyBtn text={cText(credmodal.name,credmodal.email,credmodal.password)} label="Copy Message"/>
            <a href={`mailto:${credmodal.email}?subject=${encodeURIComponent(`Your ${BRAND} Login`)}&body=${encodeURIComponent(cText(credmodal.name,credmodal.email,credmodal.password))}`} className="btn b-gold" style={{textDecoration:"none"}}>Open in Email App</a>
            {credmodal.id&&<button className={`btn ${credmodal.lead?"b-gold":"b-out"}`} onClick={()=>{const{id,lead}=credmodal;setCredmodal(null);onNewEvent(id,lead?leadToEvent(lead,catalog):null);}}>+ Create Their Event{credmodal.lead?" (from lead)":""}</button>}
            <button className="btn b-out" onClick={()=>setCredmodal(null)}>Done</button>
          </div>
        </Modal>}
      </div>}

      {/* Payments tab */}
      {tab==="payments"&&(()=>{
        const pays=[...(payments||[])].sort((a,b)=>(b.paidOn||"").localeCompare(a.paidOn||""));
        const evById=Object.fromEntries(allEvents.map(e=>[e.id,e]));
        const t=todayISO(), ym=t.slice(0,7), yr=t.slice(0,4);
        const sumWhere=f=>pays.filter(f).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        const due=allEvents.map(e=>{const tot=parseFloat(e.totalAmount)||0;const pd=paidFor(e.id,pays);return{e,tot,pd,bal:Math.max(0,tot-pd)};}).filter(x=>x.tot>0&&x.bal>0).sort((a,b)=>(a.e.eventDate||"9").localeCompare(b.e.eventDate||"9"));
        const pastDue=due.filter(x=>x.e.eventDate&&x.e.eventDate<t);
        const csv=()=>{
          const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
          const rows=[["Date","Event","Event Date","Client","Amount","Method","Reference","Note"],...pays.map(p=>{const e=evById[p.eventId]||{};return[p.paidOn,e.eventName,e.eventDate,e.clientName,p.amount,p.method,p.reference,p.note];})];
          const url=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));
          const a=document.createElement("a");a.href=url;a.download=`payments-${t}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);
        };
        const th={fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:"var(--muted)"};
        return(<div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:"10px",marginBottom:"22px"}}>
          <SBox l="Collected this month" v={money(sumWhere(p=>(p.paidOn||"").startsWith(ym)))} bg="var(--gbg2)" c="var(--green)"/>
          <SBox l={`Collected ${yr}`} v={money(sumWhere(p=>(p.paidOn||"").startsWith(yr)))} bg="var(--panel)" c="var(--ink)"/>
          <SBox l="Outstanding" v={money(due.reduce((s,x)=>s+x.bal,0))} bg="var(--pbg)" c="var(--purple)"/>
          <SBox l="Past events owing" v={pastDue.length} bg={pastDue.length?"var(--rbg)":"var(--panel)"} c={pastDue.length?"var(--red)":"var(--body)"}/>
        </div>

        <h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)",marginBottom:"10px"}}>Balances Due</h3>
        {due.length===0?<p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"26px"}}>Nothing outstanding. Events need an Event Total to show here.</p>:(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px",marginBottom:"26px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 1fr 1fr",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>{["Event","Date","Total","Received","Balance"].map(h=><div key={h} style={th}>{h}</div>)}</div>
            {due.map(({e,tot,pd,bal})=>{const past=e.eventDate&&e.eventDate<t;return(
              <div key={e.id} onClick={()=>onSelectEvent(e)} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1fr 1fr 1fr",gap:"12px",padding:"12px 18px",borderBottom:"1px solid var(--border)",cursor:"pointer",alignItems:"center"}}>
                <div><div style={{fontSize:"13.5px",color:"var(--ink)"}}>{e.eventName||"Unnamed"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{e.clientName}</div></div>
                <div style={{fontSize:"13px",color:past?"var(--red)":"var(--body)"}}>{e.eventDate?fShort(e.eventDate):"—"}{past&&<div style={{fontSize:"10.5px",fontWeight:700,textTransform:"uppercase"}}>Past event</div>}</div>
                <div style={{fontSize:"13px",color:"var(--body)"}}>{money(tot)}</div>
                <div style={{fontSize:"13px",color:"var(--green)"}}>{money(pd)}</div>
                <div style={{fontSize:"13.5px",fontWeight:700,color:past?"var(--red)":"var(--purple)"}}>{money(bal)}</div>
              </div>);})}
          </div></div>
        )}

        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px",gap:"10px",flexWrap:"wrap"}}>
          <h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)"}}>Payment Log</h3>
          {pays.length>0&&<button className="btn b-out" onClick={csv} style={{padding:"6px 14px",fontSize:"12px"}}>⬇ Export CSV</button>}
        </div>
        {pays.length===0?<p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"30px"}}>No payments recorded yet. Record them from each event's page.</p>:(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px",marginBottom:"30px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 2fr 1.2fr 1.6fr 1fr",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>{["Date","Event","Method","Note / Ref","Amount"].map(h=><div key={h} style={th}>{h}</div>)}</div>
            {pays.map(p=>{const e=evById[p.eventId];return(
              <div key={p.id} onClick={()=>e&&onSelectEvent(e)} style={{display:"grid",gridTemplateColumns:"1fr 2fr 1.2fr 1.6fr 1fr",gap:"12px",padding:"11px 18px",borderBottom:"1px solid var(--border)",cursor:e?"pointer":"default",alignItems:"center",fontSize:"13px"}}>
                <div style={{color:"var(--muted)"}}>{fShort(p.paidOn)}</div>
                <div><div style={{color:"var(--ink)"}}>{e?.eventName||"(deleted event)"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{e?.clientName}</div></div>
                <div style={{color:"var(--body)"}}>{p.method||"—"}</div>
                <div style={{color:"var(--body)"}}>{[p.note,p.reference&&`#${p.reference}`].filter(Boolean).join(" · ")||"—"}</div>
                <div style={{color:"var(--green)",fontWeight:700}}>{money(p.amount)}</div>
              </div>);})}
          </div></div>
        )}

        <div style={{marginBottom:"22px"}}><h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)",marginBottom:"4px"}}>Payment Methods</h3><p style={{fontSize:"13px",color:"var(--muted)"}}>Enable each method. Clients see payment links on their event page when you add a payment request.</p></div>
        <PayToggle id="venmo"   label="Venmo"    icon="💙" desc="Pre-filled Venmo payment link"          field="venmo"    placeholder="@YourVenmo"             lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="cashapp" label="Cash App" icon="💚" desc="Pre-filled Cash App payment link"       field="cashApp"  placeholder="$YourCashtag"           lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="zelle"   label="Zelle"    icon="💜" desc="Display Zelle info for transfer"        field="zelle"    placeholder="your@email.com or phone" lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="paypal"  label="PayPal"   icon="💙" desc="PayPal.me link for quick payments"      field="paypalMe" placeholder="YourPayPalHandle"       lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        {pdirty&&<div style={{display:"flex",justifyContent:"flex-end",marginTop:"20px"}}>
          <button className="btn b-gold" disabled={psaving} onClick={async()=>{setPsaving(true);await onSavePaySettings(lps);setPdirty(false);setPsaving(false);}} style={{padding:"10px 28px"}}>
            {psaving?<span style={{animation:"pulse 1s infinite"}}>Saving…</span>:"Save Payment Settings"}
          </button>
        </div>}
      </div>);})()}
    </main>
  </div>);}

// ════════════════════════════════════════════════
// ADMIN EVENT VIEW
// ════════════════════════════════════════════════
function AdminEventView({event,notes:savedNotes,profiles,paySettings,payRequests,payments,onSave,onEditDetails,onAddPayReq,onUpdatePayReq,onAddPayment,onDeletePayment,onBack}){
  const[status,setStatus]=useState(event.status||"draft");
  const[notes,setNotes]=useState(savedNotes||"");
  const[total,setTotal]=useState(event.totalAmount||"");
  const[saved,setSaved]=useState(false);
  const[addingReq,setAddingReq]=useState(false);
  const[rf,setRf]=useState({amount:"",label:"",dueDate:""});
  const[pf,setPf]=useState(null); // record-payment form: {amount,paidOn,method,reference,note,requestId}
  const[showInvoice,setShowInvoice]=useState(false);
  const[showContract,setShowContract]=useState(false);
  const[showEmails,setShowEmails]=useState(false);
  const owner=profiles.find(p=>p.id===event.userId);
  const myReqs=(payRequests||[]).filter(r=>r.eventId===event.id);
  const myPays=(payments||[]).filter(p=>p.eventId===event.id).sort((a,b)=>(b.paidOn||"").localeCompare(a.paidOn||""));
  const evTotal=parseFloat(event.totalAmount)||0;
  const evPaid=paidFor(event.id,payments);
  const evBal=Math.max(0,evTotal-evPaid);
  const isPast=!!event.eventDate&&event.eventDate<todayISO();
  const openPay=(o={})=>setPf({amount:"",paidOn:todayISO(),method:"",methodOther:"",reference:"",note:"",requestId:null,...o});
  const savePay=async()=>{
    if(!(parseFloat(pf.amount)>0))return alert("Enter the amount received.");
    if(pf.method==="Other"&&!pf.methodOther.trim())return alert("Type the payment method for Other.");
    const{methodOther,...rest}=pf;
    await onAddPayment({...rest,method:pf.method==="Other"?methodOther.trim():pf.method,id:uid(),eventId:event.id});setPf(null);
  };
  const ps=paySettings||BLANK_PAY;
  const m=meta(event.eventType);
  const gcal=gcalLink(event);

  const saveCtrl=async()=>{await onSave({...event,status,totalAmount:total},notes);setSaved(true);setTimeout(()=>setSaved(false),2500);};
  const addReq=async()=>{if(!rf.amount||!rf.label)return;await onAddPayReq({id:uid(),eventId:event.id,amount:rf.amount,label:rf.label,dueDate:rf.dueDate,status:"pending"});setAddingReq(false);setRf({amount:"",label:"",dueDate:""});};

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    {showInvoice&&<InvoiceView event={event} payRequests={myReqs} payments={payments} onClose={()=>setShowInvoice(false)}/>}
    {showContract&&<ContractView event={event} payRequests={myReqs} onClose={()=>setShowContract(false)}/>}
    {showEmails&&<EmailTemplates event={event} owner={owner} payRequests={myReqs} paySettings={ps} payments={payments} onClose={()=>setShowEmails(false)}/>}
    <TopNav title="Admin: Event Detail" back={onBack} badge="Admin"/>
    <div style={{maxWidth:"960px",margin:"0 auto",padding:"28px 24px"}}>
      <Hero ev={event}/>

      {/* Quick action buttons */}
      <div style={{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"18px"}}>
        <button className="btn b-gold" onClick={onEditDetails} style={{fontSize:"13px"}}>✏️ Edit Event Details</button>
        {gcal&&<a href={gcal} target="_blank" rel="noreferrer" className="btn b-out" style={{fontSize:"13px"}}>📅 Add to Google Calendar</a>}
        <button className="btn b-out" onClick={()=>setShowInvoice(true)} style={{fontSize:"13px"}}>🧾 Generate Invoice</button>
        <button className="btn b-out" onClick={()=>setShowContract(true)} style={{fontSize:"13px"}}>📄 Generate Contract</button>
        <button className="btn b-out" onClick={()=>setShowEmails(true)} style={{fontSize:"13px"}}>✉️ Emails</button>
      </div>

      {/* Admin controls */}
      <div style={{background:"var(--pbg)",border:"1.5px solid var(--pbdr)",borderRadius:"12px",padding:"20px 24px",marginBottom:"18px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px"}}><span style={{fontSize:"16px"}}>🔐</span><span style={{fontSize:"12px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"var(--purple)"}}>Admin Controls</span></div>
        <div style={{display:"flex",gap:"14px",flexWrap:"wrap",alignItems:"flex-end"}}>
          <div className="fg" style={{flex:"0 0 190px"}}>
            <label className="lbl">Event Status</label>
            <select value={status} onChange={e=>setStatus(e.target.value)}>
              <option value="draft">Draft</option>
              <option value="submitted">Submitted</option>
              <option value="confirmed">Confirmed</option>
            </select>
          </div>
          <div className="fg" style={{flex:"0 0 160px"}}>
            <label className="lbl">Event Total ($)</label>
            <input type="number" min="0" step="0.01" value={total} onChange={e=>setTotal(e.target.value)} placeholder="1500.00"/>
          </div>
          <div className="fg" style={{flex:1,minWidth:"200px"}}>
            <label className="lbl">Admin Notes (internal — client cannot see)</label>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Internal notes…" style={{minHeight:"56px",fontSize:"13px"}}/>
          </div>
          <button className="btn b-purple" onClick={saveCtrl} style={{padding:"10px 20px",fontSize:"13px",flexShrink:0}}>{saved?"✓ Saved!":"Save Changes"}</button>
        </div>
        {event.packageName&&<div style={{marginTop:"12px",paddingTop:"12px",borderTop:"1px solid var(--pbdr)",fontSize:"12.5px",color:"var(--body)"}}><strong style={{color:"var(--ink)"}}>{event.packageName}</strong>{num(event.packageHours)?` · ${num(event.packageHours)+(num(event.extraHours)||0)} hrs`:""}{(event.addons||[]).length?` · ${event.addons.map(a=>a.name).join(", ")}`:""}{num(event.depositAmount)!=null?` · Deposit ${money(event.depositAmount)}`:""} <span style={{color:"var(--muted)"}}>(change with Edit Event Details)</span></div>}
        {owner&&<div style={{marginTop:"12px",paddingTop:"12px",borderTop:"1px solid var(--pbdr)",fontSize:"12px",color:"var(--purple)",opacity:.85}}>Account: <strong>{owner.name||owner.email}</strong> ({owner.email}){event.createdAt&&` · Submitted ${fShort(event.createdAt)}`}</div>}
      </div>

      {/* Payments: totals, schedule (requests), and log of money received */}
      <div style={{background:"var(--white)",border:"1.5px solid var(--pbdr)",borderRadius:"12px",padding:"20px 24px",marginBottom:"18px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"10px",flexWrap:"wrap",marginBottom:"14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{fontSize:"16px"}}>💳</span><span style={{fontSize:"12px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"var(--purple)"}}>Payments</span></div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            {evBal>0&&<button className="btn b-green" onClick={()=>openPay({amount:evBal.toFixed(2),note:"Final payment"})} style={{padding:"6px 14px",fontSize:"12px"}}>Record Final Payment</button>}
            <button className="btn b-purple" onClick={()=>openPay()} style={{padding:"6px 14px",fontSize:"12px"}}>+ Record Payment</button>
            <button className="btn b-out" onClick={()=>setAddingReq(true)} style={{padding:"6px 14px",fontSize:"12px"}}>+ Request Payment</button>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:"12px",marginBottom:"14px"}}>
          {[["Total",evTotal?money(evTotal):"Not set","var(--ink)"],["Received",money(evPaid),"var(--green)"],["Balance",money(evBal),evBal>0?"var(--purple)":"var(--green)"]].map(([l,v,c])=>(
            <div key={l}><div className="lbl">{l}</div><div style={{fontFamily:"var(--ff)",fontSize:"22px",color:c}}>{v}</div></div>
          ))}
        </div>
        {isPast&&evBal>0&&<div style={{padding:"10px 12px",background:"var(--rbg)",border:"1.5px solid var(--rbdr)",borderRadius:"var(--r)",fontSize:"12.5px",color:"var(--red)",marginBottom:"12px"}}>Event date has passed — {money(evBal)} is still outstanding.</div>}
        {evTotal>0&&evBal<=0&&<div style={{padding:"10px 12px",background:"var(--gbg2)",border:"1.5px solid var(--gbdr2)",borderRadius:"var(--r)",fontSize:"12.5px",color:"var(--green)",marginBottom:"12px"}}>✓ Paid in full</div>}

        </div>}
      </div>

      {/* Full event details */}
      <Sec title="Contact Information" emoji="👤"><Row l="Name" v={event.clientName}/><Row l="Email" v={event.email}/><Row l="Phone" v={event.phone}/><Row l="Address" v={event.address}/></Sec>

      <Sec title="Special Songs" emoji="🎵">
        <Song l="Grand Entrance" s={event.grandEntranceSong} a={event.grandEntranceArtist}/>

        {(event.eventType==="bar_mitzvah"||event.eventType==="bat_mitzvah")&&<Song l="Hora" s={event.horaSong} a={event.horaArtist}/>}
        <Song l="Opening Song" s={event.openingSong} a={event.openingArtist}/>
        <Song l="Last Dance"   s={event.lastDanceSong} a={event.lastDanceArtist}/>
      </Sec>
      {event.mustPlay?.some(s=>s.song)&&<Sec title="Must-Play Songs" emoji="🎤">{event.mustPlay.filter(s=>s.song).map((s,i)=><div key={i} style={{display:"flex",gap:"7px",marginBottom:"6px",fontSize:"13px"}}><span style={{color:"var(--gold)"}}>♪</span><span style={{color:"var(--ink)"}}>{s.song}</span>{s.artist&&<span style={{color:"var(--muted)"}}>— {s.artist}</span>}</div>)}</Sec>}
      {event.doNotPlay?.some(s=>s.song)&&<Sec title="Do Not Play" emoji="🚫">{event.doNotPlay.filter(s=>s.song).map((s,i)=><div key={i} style={{display:"flex",gap:"7px",marginBottom:"6px",fontSize:"13px"}}><span style={{color:"var(--red)"}}>✕</span><span style={{color:"var(--ink)"}}>{s.song}</span>{s.artist&&<span style={{color:"var(--muted)"}}>— {s.artist}</span>}</div>)}</Sec>}
      {event.vibes?.length>0&&<Sec title="Music Vibes" emoji="🎶"><div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>{event.vibes.map(v=><span key={v} style={{padding:"4px 11px",borderRadius:"20px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",color:"var(--gold)",fontSize:"12px",fontWeight:600}}>{v}</span>)}</div></Sec>}
      {event.specialRequests&&<Sec title="Special Requests (from client)" emoji="📝"><p style={{fontSize:"13px",color:"var(--ink)",lineHeight:1.75}}>{event.specialRequests}</p></Sec>}
      {savedNotes&&<Sec title="Admin Notes (internal)" emoji="🔐"><p style={{fontSize:"13px",color:"var(--purple)",lineHeight:1.75,fontStyle:"italic"}}>{savedNotes}</p></Sec>}
    </div>
  </div>);}

// GOOGLE CALENDAR LINK GENERATOR
// ════════════════════════════════════════════════
function gcalLink(event){
  if(!event.eventDate) return null;
  const pad = n => String(n).padStart(2,"0");
  const dateStr = event.eventDate.replace(/-/g,"");
  let start, end;
  if(event.startTime){
    const [sh,sm]=event.startTime.split(":");
    start=`${dateStr}T${pad(sh)}${pad(sm)}00`;
    if(event.endTime){
      const [eh,em]=event.endTime.split(":");
      end=`${dateStr}T${pad(eh)}${pad(em)}00`;
    } else {
      // default 4 hours
      const eh=(parseInt(sh)+4)%24;
      end=`${dateStr}T${pad(eh)}${pad(sm)}00`;
    }
  } else {
    start=dateStr; end=dateStr;
  }
  const loc=encodeURIComponent([event.venueName,event.venueAddress,event.venueCity,event.venueState].filter(Boolean).join(", "));
  const title=encodeURIComponent(event.eventName||"Event");
  const details=encodeURIComponent(`Client: ${event.clientName}\nPhone: ${event.phone}\nEmail: ${event.email}\nGuests: ${event.guestCount||"TBD"}`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&location=${loc}&details=${details}`;
}

function buildEmails(ev, reqs, ps, pays, login={}){
  const b=getBrand();
  const first=(ev.clientName||"").trim().split(/\s+/)[0]||"there";
  const name=ev.eventName||meta(ev.eventType).label;
  const when=`${fDate(ev.eventDate)}${ev.startTime?`, ${f12(ev.startTime)}${ev.endTime?` – ${f12(ev.endTime)}`:""}`:""}`;
  const venue=[ev.venueName,[ev.venueAddress,ev.venueCity,ev.venueState].filter(Boolean).join(", ")].filter(Boolean).join(" — ")||"TBD";
  const total=parseFloat(ev.totalAmount)||0;
  const paid=paidFor(ev.id,pays);
  const balance=Math.max(0,total-paid);
  const pending=reqs.filter(r=>r.status!=="paid");
  const user=login.email||ev.email||"";
  const loginBlock=`Your planning portal:\n${PORTAL}\nUsername: ${user||"(your email address)"}\nPassword: ${login.password||'use "Forgot password?" on the login page to set one'}`;
  const sign=`Thanks,\nBryon\n${b.name} — ${b.tagline}\n${b.phone} · ${b.email}`;
  const songs=songSlots(ev.eventType).map(([l,k])=>[l,ev[k+"Song"],ev[k+"Artist"]]);
  const songLine=([l,s,a])=>`  • ${l}: ${s}${a?` — ${a}`:""}`;
  const planDue=ev.eventDate?fDate(new Date(new Date(ev.eventDate+"T00:00:00").getTime()-7*864e5).toISOString().slice(0,10)):"one week before the event";
  const methods=[
    ps.methods?.venmo&&ps.venmo&&`  • Venmo: @${ps.venmo.replace("@","")}`,
    ps.methods?.cashapp&&ps.cashApp&&`  • Cash App: ${ps.cashApp.startsWith("$")?ps.cashApp:"$"+ps.cashApp}`,
    ps.methods?.zelle&&ps.zelle&&`  • Zelle: ${ps.zelle}`,
    ps.methods?.paypal&&ps.paypalMe&&`  • PayPal: paypal.me/${ps.paypalMe}`,
  ].filter(Boolean);
  const missing=[
    !ev.venueAddress&&"Venue street address",
    !ev.venueContact&&"Venue coordinator name & phone",
    (!ev.timeline?.length||ev.timeline.some(t=>!t.time))&&"Times for each part of the timeline",
    ...songs.filter(([,s])=>!s).map(([l])=>`${l} song`),
    !ev.mustPlay?.some(x=>x.song)&&"Must-play songs",
    !ev.doNotPlay?.some(x=>x.song)&&"Do-not-play list",
    !ev.vibes?.length&&"Music vibe / genres",
  ].filter(Boolean);

  return [
    {id:"booking",label:"Booking confirmation",
     subject:`You're booked! ${name} — ${fShort(ev.eventDate)||"date TBD"}`,
     body:`Hi ${first},\n\nThank you for choosing ${b.name}! Your date is officially on our calendar and we can't wait to celebrate with you.\n\nEvent: ${name}\nDate & time: ${when}\nVenue: ${venue}${ev.guestCount?`\nGuests: ${ev.guestCount}`:""}${ev.packageName?`\nPackage: ${ev.packageName}${num(ev.packageHours)?` (${num(ev.packageHours)+(num(ev.extraHours)||0)} hours)`:""}`:""}${(ev.addons||[]).length?`\nAdd-ons: ${ev.addons.map(a=>a.name).join(", ")}`:""}\n${total?`\nDeposit to reserve your date: ${money(num(ev.depositAmount)??200)}\nEvent total: ${money(total)}\nPaid so far: ${money(paid)}\nRemaining balance: ${money(balance)}\n`:""}\nNext step: log in to your planning portal and fill in your timeline, special songs, and must-play / do-not-play lists. Your invoice and contract are there too, ready to view or download. Please have it complete by ${planDue} (7 days before the event) so we can prepare everything.\n\n${loginBlock}\n\nIf you have any questions, just reply to this email.\n\n${sign}`},
    {id:"login",label:"Portal login",
     subject:`Your planning portal login: ${name}`,
     body:`Hi ${first},\n\nYour planning portal for ${name} on ${fDate(ev.eventDate)} is ready. Your contract, invoice and planning forms are all there.\n\n${loginBlock}\n\nYou can change your password any time with "Forgot password?" on the login page.\n\n${sign}`},
    {id:"planning",label:"Planning reminder",
     subject:`Planning reminder: ${name} — details due ${planDue}`,
     body:`Hi ${first},\n\nYour event is coming up on ${fDate(ev.eventDate)}! To make sure everything goes exactly how you want it, please finish your planner by ${planDue}.\n\n${missing.length?`Here's what's still open:\n${missing.map(m=>`  • ${m}`).join("\n")}`:"Everything looks complete — please give it one last look to make sure it's all correct."}\n\nYou can update everything in your portal.\n\n${loginBlock}\n\n${sign}`},
    {id:"payment",label:"Payment reminder",
     subject:`Payment reminder: ${name}`,
     body:`Hi ${first},\n\nA friendly reminder about payment for ${name} on ${fDate(ev.eventDate)}.\n\n${pending.length?pending.map(r=>`  • ${r.label}: ${money(r.amount)}${r.dueDate?` (due ${fShort(r.dueDate)})`:""}`).join("\n")+"\n\n":""}${total?`Event total: ${money(total)}\nPaid so far: ${money(paid)}\nRemaining balance: ${money(balance)}\n\n`:""}${methods.length?`You can pay any of these ways:\n${methods.join("\n")}\n\nPayment links are also on your event page in the portal: ${PORTAL}\n\n`:`Payment details are on your event page in the portal: ${PORTAL}\n\n`}Any remaining balance is due before setup on the day of the event.\n\n${sign}`},
    {id:"final",label:"Final details (week of)",
     subject:`Final details for ${name} — ${fShort(ev.eventDate)}`,
     body:`Hi ${first},\n\nWe're almost there! Here's the plan we have on file — please reply if anything needs to change.\n\nDate & time: ${when}\nVenue: ${venue}${ev.venueContact?`\nVenue coordinator: ${ev.venueContact}${ev.venuePhone?` (${ev.venuePhone})`:""}`:""}\n\nTimeline:\n${ev.timeline?.length?ev.timeline.map(t=>`  • ${t.time?f12(t.time):"—"}  ${t.label}${t.note?` (${t.note})`:""}`).join("\n"):"  • (not filled in yet)"}\n\nSpecial songs:\n${songs.filter(([,s])=>s).map(songLine).join("\n")||"  • (none chosen yet — we'll pick great options)"}\n${ev.doNotPlay?.some(x=>x.song)?`\nDo not play:\n${ev.doNotPlay.filter(x=>x.song).map(x=>`  • ${x.song}${x.artist?` — ${x.artist}`:""}`).join("\n")}\n`:""}\nWe'll arrive about 90 minutes before the start time to set up.${balance>0?` Your remaining balance of ${money(balance)} is due before setup.`:""}\n\n${sign}`},
    {id:"thanks",label:"Thank you + review",
     subject:`Thank you, ${first}!`,
     body:`Hi ${first},\n\nThank you for having us at ${name}! It was a pleasure being part of your celebration, and we hope you and your guests had an amazing time.\n\nIf you have a minute, a quick review would mean the world to us${REVIEW_URL?`:\n${REVIEW_URL}`:" — on Google or The Knot, wherever you like."}\n\nAnd if friends or family ever need a DJ, we'd love to help.\n\n${sign}`},
  ];
}

function EmailTemplates({event,owner,payRequests,paySettings,payments,onClose}){
  const[pw,setPw]=useState(SESSION_PW[event.userId]||"");
  const[pwBusy,setPwBusy]=useState(false);
  const username=owner?.email||event.email||"";
  const list=buildEmails(event,payRequests||[],paySettings||BLANK_PAY,payments||[],{email:username,password:pw});
  const[sel,setSel]=useState(list[0].id);
  const[edits,setEdits]=useState({}); // keep the admin's tweaks per template while the modal is open
  const base=list.find(e=>e.id===sel);
  const cur={...base,...edits[sel]};
  const upd=(k,v)=>setEdits(p=>({...p,[sel]:{...p[sel],[k]:v}}));
  const newPw=async()=>{
    if(!confirm(`Set a new temporary password for ${username}? Their current password will stop working.`))return;
    const p=tempPassword();setPwBusy(true);
    const{data,error}=await DB.rpc("dj_admin_set_password",{client_id:event.userId,new_password:p});
    setPwBusy(false);
    if(error||!data){alert(error?.message||"Couldn't find that client's account.");return;}
    SESSION_PW[event.userId]=p;setPw(p);
  };
  const mailto=`mailto:${encodeURIComponent(event.email||username)}?subject=${encodeURIComponent(cur.subject)}&body=${encodeURIComponent(cur.body)}`;
  return(
    <Modal close={onClose} w={760}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
        <h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)"}}>Emails</h3>
        <button className="btn b-ghost" onClick={onClose} style={{fontSize:"18px",padding:"4px 8px"}}>✕</button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"16px"}}>
        {list.map(e=><div key={e.id} className={`vc ${sel===e.id?"vc-on":"vc-off"}`} onClick={()=>setSel(e.id)}>{e.label}</div>)}
      </div>
      <div className="fg" style={{marginBottom:"10px"}}><label className="lbl">To</label><input value={event.email||username} readOnly placeholder="No client email on file"/></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"10px",marginBottom:"4px"}}>
        <div className="fg"><label className="lbl">Portal Username</label><input value={username} readOnly placeholder="No portal account"/></div>
        <div className="fg"><label className="lbl">Portal Password</label>
          <div style={{display:"flex",gap:"6px"}}>
            <input value={pw} onChange={e=>setPw(e.target.value)} placeholder="Type it, or set a new one →" style={{flex:1,minWidth:0}}/>
            {event.userId&&owner&&!owner.is_admin&&<button className="btn b-out" onClick={newPw} disabled={pwBusy} style={{padding:"6px 10px",fontSize:"11px",whiteSpace:"nowrap"}}>{pwBusy?"Setting…":"New Temp Password"}</button>}
          </div>
        </div>
      </div>

// ── PDF export (html2pdf loaded on first use) ──
let _h2p=null;
const loadPdfLib=()=>_h2p||(_h2p=new Promise((res,rej)=>{
  if(window.html2pdf)return res(window.html2pdf);
  const el=document.createElement("script");
  el.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
  el.onload=()=>res(window.html2pdf);
  el.onerror=()=>{_h2p=null;rej(new Error("Couldn't load the PDF tool. Check your connection and try again."));};
  document.head.appendChild(el);
}));
const pdfBlob=async(el,filename)=>{
  const h=await loadPdfLib();
  return h().set({margin:[8,8,8,8],filename,image:{type:"jpeg",quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"letter",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(el).outputPdf("blob");
};
const canShareFiles=()=>{try{return !!navigator.canShare&&navigator.canShare({files:[new File([""],"t.pdf",{type:"application/pdf"})]});}catch{return false;}};
const safeName=t=>(t||"Event").replace(/[\\/:*?"<>|]+/g,"").trim();

// Print / Download PDF / Share buttons for an invoice or contract.
// The PDF is built ahead of time so Share can open the share sheet straight from the tap (phones require that).
function DocActions({targetId,filename,title,version,onClose}){
  const[blob,setBlob]=useState(null);
  const[busy,setBusy]=useState("");
  const share=canShareFiles();
  useEffect(()=>{
    let live=true;setBlob(null);
    const t=setTimeout(async()=>{const el=document.getElementById(targetId);if(!el)return;try{const b=await pdfBlob(el,filename);if(live)setBlob(b);}catch{}},version?700:300);
    return()=>{live=false;clearTimeout(t);};
  },[targetId,filename,version]);
  const getBlob=async()=>blob||await pdfBlob(document.getElementById(targetId),filename);
  const download=async()=>{
    setBusy("download");
    try{const b=await getBlob();const url=URL.createObjectURL(b);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}
    catch(e){alert(e.message||"Couldn't create the PDF.");}
    setBusy("");
  };
  const doShare=async()=>{
    if(!blob)return;
    try{await navigator.share({files:[new File([blob],filename,{type:"application/pdf"})],title});}
    catch(e){if(e.name!=="AbortError")alert("Sharing didn't work on this device — use Download PDF and attach it instead.");}
  };
  return(
    <div style={{display:"flex",gap:"10px",marginBottom:"16px",justifyContent:"flex-end",flexWrap:"wrap"}}>
      {share&&<button className="btn b-gold" onClick={doShare} disabled={!blob} style={{padding:"9px 18px"}}>{blob?"📤 Share / Email PDF":"Preparing PDF…"}</button>}
      <button className={`btn ${share?"b-out":"b-gold"}`} onClick={download} disabled={busy==="download"} style={{padding:"9px 18px"}}>{busy==="download"?"Creating PDF…":"⬇ Download PDF"}</button>
      <button className="btn b-out" onClick={()=>window.print()}>🖨 Print</button>
      <button className="btn b-out" onClick={onClose}>✕ Close</button>
    </div>
  );
}

              ["6.3",brand.name+" reserves the right to deny any guest access to the sound system, music recordings, or other equipment."],
              ["7. Cancellation",""],
              ["7.1","This agreement cannot be canceled except by mutual written consent of both the client and "+brand.name+"."],
              ["7.2","If cancellation is initiated by the client in writing and agreed to by "+brand.name+" in writing, the client shall be required to pay any unrecoverable costs already incurred."],
              ["7.3","Up to 45 days prior to the event: "+brand.name+" is entitled to the Contract Signing Payment ("+money(deposit)+")."],
              ["7.4","Between 30 days and 45 days prior to the event: "+brand.name+" is entitled to 75% of the amount for services."],
              ["7.5","If the event is cancelled 30 days or less from the date of the event, "+brand.name+" is entitled to 100% of the amount for services."],
              ["8. Photo Montages",""],
              ["8.1","All materials for photo montages are due into "+brand.name+" 15 days prior to the event."],
              ["8.2","A $50 late fee will be assessed for materials received after 15 days prior to the event."],
              ["8.3","Do not send materials later than 10 days prior to the event as there will not be enough time to develop the montage."],
              ["9. Song Content","Due to the nature of current music, "+brand.name+" is not responsible for foul or abusive content in songs or singers' comments on microphones. Standard non-karaoke music is all radio versions or censored. If requested, "+brand.name+" will make 2 announcements about use of language but cannot police the entire evening."],
            ].map(([num,text],i)=>{
              const isHeader=text===""||num.split(".").length===1;
              if(isHeader&&text==="") return <p key={i} style={{fontWeight:700,marginTop:"16px",marginBottom:"6px",color:"#111111",fontSize:"13.5px"}}>{num}</p>;
              return <p key={i} style={{marginBottom:"8px",paddingLeft:isHeader?"0":"0"}}><strong>{num}.</strong> {text}</p>;
            })}
          </div>

          <p style={{marginBottom:"24px",fontStyle:"italic",color:"#6a7090",fontSize:"12px"}}>This contract may not be altered, cancelled, assigned, or transferred without the consent and authorization of {brand.name}. If unauthorized changes are made, {brand.name} reserves the right to void the contract and withhold the contract signing fee.</p>

          {/* Signature lines */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"32px",marginTop:"32px",paddingTop:"24px",borderTop:"2px solid #dde1eb"}}>
            <div>
              <div style={{marginBottom:"16px"}}>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>{brand.name} Representative</label>
                <input value={dmSig} onChange={e=>setDmSig(e.target.value)} placeholder="Authorized signature" style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"15px",fontFamily:"'Playfair Display',Georgia,serif",fontStyle:"italic"}}/>
              </div>
              <div>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Date</label>
                <input value={dmDate} onChange={e=>setDmDate(e.target.value)} placeholder={today} style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"14px"}}/>
              </div>
            </div>
            <div>
              <div style={{marginBottom:"16px"}}>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Client Signature</label>
                <input value={clientSig} onChange={e=>setClientSig(e.target.value)} placeholder="Client full name" style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"15px",fontFamily:"'Playfair Display',Georgia,serif",fontStyle:"italic"}}/>
              </div>
              <div>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Date</label>
                <input value={clientDate} onChange={e=>setClientDate(e.target.value)} placeholder={today} style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"14px"}}/>
              </div>
            </div>
          </div>
        </div>
      </div>
      <style>{`@media print { body * { visibility: hidden; } #contract-print, #contract-print * { visibility: visible; } #contract-print { position: fixed; top: 0; left: 0; width: 100%; padding: 32px; font-size: 11px; } #contract-print input { border: none !important; outline: none !important; } }`}</style>
    </div>
  );
}

// ════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════
function App(){
  const[user,setUser]     =useState(null);
  const[loading,setLoad]  =useState(true);
  const[screen,setScreen] =useState("auth");
  const[events,setEvents] =useState([]);
  const[allEvs,setAllEvs] =useState([]);
  const[profiles,setProfs]=useState([]);
  const[paySet,setPaySet] =useState(BLANK_PAY);
  const[payReqs,setPayReqs]=useState([]);
  const[pays,setPays]     =useState([]);
  const[leads,setLeads]   =useState([]);
  const[selId,setSelId]   =useState(null);
  const[notesMap,setNotesMap]=useState({}); // admin-only notes, keyed by event id
  const[catalog,setCatalog]=useState({packages:[],addons:[]});

  // ── Load session on mount ────────────────────
  useEffect(()=>{
    (async()=>{
      // Detect Supabase password-recovery redirect (URL contains #type=recovery)
      const hash = window.location.hash || "";
      if(hash.includes("type=recovery")){
        // Supabase sets the session automatically from the hash; wait briefly
        await new Promise(r=>setTimeout(r,400));
        setLoad(false);
        setScreen("reset");
        // Clean the hash from the URL bar without reload
        history.replaceState(null,"",window.location.pathname+window.location.search);
        return;
      }
      const{data:{session}}=await DB.auth.getSession();
      if(session){
        const{data:prof}=await DB.from("dj_profiles").select("*").eq("id",session.user.id).single();
        const u={...session.user,...(prof||{})};
        setUser(u);
        await loadUserData(u);
      }
      setLoad(false);
    })();
  },[]);

  const loadCatalog=async()=>{
    const[{data:pk},{data:ad}]=await Promise.all([DB.from("dj_packages").select("*").order("sort"),DB.from("dj_addons").select("*").order("sort")]);
    setCatalog({packages:pk||[],addons:ad||[]});
  };
  const handleSaveCatalog=async(table,r)=>{
    const{_new,...row}=r;
    for(const k of ["price","hours","overtime_rate","deposit"]) if(k in row) row[k]=num(row[k])||0;
    if("per_unit" in row) row.per_unit=(row.per_unit||"").trim()||null;
    const{error}=await DB.from(table).upsert(row,{onConflict:"id"});
    if(error){alert(`Couldn't save: ${error.message}`);return false;}
    await loadCatalog();return true;
  };
  const loadUserData=async u=>{
    // Load payment settings (all users need to see payment methods)
    const{data:ps}=await DB.from("dj_payment_settings").select("*").order("updated_at",{ascending:false}).limit(1).single();
    if(ps){setPaySet({venmo:ps.venmo||"",cashApp:ps.cash_app||"",zelle:ps.zelle||"",paypalMe:ps.paypal_me||"",methods:ps.methods||{}});}else{setPaySet(BLANK_PAY);}
    await loadCatalog();

    if(u.is_admin){
      const{data:evs}=await DB.from("dj_events").select("*").order("event_date",{ascending:true,nullsFirst:false});
      setAllEvs((evs||[]).map(fromRow));
      const{data:profs}=await DB.from("dj_profiles").select("*").order("created_at",{ascending:false});
      setProfs(profs||[]);
      const{data:pr}=await DB.from("dj_payment_requests").select("*");
      setPayReqs(pr||[]);
      const{data:pm}=await DB.from("dj_payments").select("*");
      setPays(pm||[]);
      const{data:ld}=await DB.from("dj_leads").select("*").order("created_at",{ascending:false});
      setLeads(ld||[]);
      const{data:nt}=await DB.from("dj_event_notes").select("*");
      setNotesMap(Object.fromEntries((nt||[]).map(n=>[n.event_id,n.notes||""])));
      setScreen("admin");
    } else {
      const{data:evs}=await DB.from("dj_events").select("*").eq("user_id",u.id).order("updated_at",{ascending:false});
      setEvents((evs||[]).map(fromRow));
      const{data:pr}=await DB.from("dj_payment_requests").select("*").in("event_id",(evs||[]).map(e=>e.id));
      setPayReqs(pr||[]);
      const{data:pm}=await DB.from("dj_payments").select("*").in("event_id",(evs||[]).map(e=>e.id));
      setPays(pm||[]);
      setScreen("dash");
    }
  };

  const handleLogin=async u=>{setUser(u);await loadUserData(u);};
  const handleLogout=async()=>{await DB.auth.signOut();setUser(null);setEvents([]);setScreen("auth");};

  const handleSaveEvent=async ev=>{
    // Clients can only update events the admin created (the DB rejects client inserts, incl. upserts)
    const q=user?.is_admin?DB.from("dj_events").upsert(toRow(ev),{onConflict:"id"}):DB.from("dj_events").update(toRow(ev)).eq("id",ev.id);
    const{data,error}=await q.select().single();
    if(error||!data)return `Couldn't save the event: ${error?.message||"no response from the database"}`;
    const mapped=fromRow(data);
    setEvents(p=>p.some(e=>e.id===mapped.id)?p.map(e=>e.id===mapped.id?mapped:e):[...p,mapped]);
    if(user?.is_admin)setAllEvs(p=>p.some(e=>e.id===mapped.id)?p.map(e=>e.id===mapped.id?mapped:e):[...p,mapped]);
    setSelId(mapped.id);
    setScreen(user?.is_admin?"admin_view":"view");
  };

  const[newFor,setNewFor]=useState(null); // client id preselected when admin starts a new event
  const[newPrefill,setNewPrefill]=useState(null); // event details carried over from a website lead
  const handleAdminSave=async(ev,notes)=>{
    const{data,error}=await DB.from("dj_events").upsert(toRow(ev),{onConflict:"id"}).select().single();
    if(error){alert(`Couldn't save: ${error.message}`);return;}
    const{error:nErr}=await DB.from("dj_event_notes").upsert({event_id:ev.id,notes,updated_at:new Date().toISOString()},{onConflict:"event_id"});
    if(nErr){alert(`Couldn't save notes: ${nErr.message}`);return;}
    setNotesMap(m=>({...m,[ev.id]:notes}));
    if(data){const m=fromRow(data);setAllEvs(p=>p.map(e=>e.id===m.id?m:e));}
  };
  const handleSavePaySettings=async s=>{const{error}=await DB.from("dj_payment_settings").upsert({id:"00000000-0000-0000-0000-000000000001",venmo:s.venmo||"",cash_app:s.cashApp||"",zelle:s.zelle||"",paypal_me:s.paypalMe||"",methods:s.methods||{}},{onConflict:"id"});if(error){alert(`Couldn't save payment settings: ${error.message}`);return;}setPaySet(s);};

  const handleAddClient=async(name,email,password)=>{
    const{data,error}=await SIGNUP_DB.auth.signUp({email,password,options:{data:{name},emailRedirectTo:PORTAL}});
    if(error)return error.message;
    if(!data?.user?.id)return "Could not create the account. Please try again.";
    // No DB trigger creates dj_profiles rows (auth is shared with other apps), so the admin adds it here
    const{error:pErr}=await DB.from("dj_profiles").upsert({id:data.user.id,name,email,is_admin:false},{onConflict:"id"});
    if(pErr)return pErr.message;
    // Admin-created accounts skip the email-confirmation step so the client can log in with the password you send
    const{error:cErr}=await DB.rpc("dj_admin_confirm_client",{client_id:data.user.id});
    if(cErr)return `Account created, but couldn't confirm it: ${cErr.message}`;
    const{data:profs}=await DB.from("dj_profiles").select("*").order("created_at",{ascending:false});
    setProfs(profs||[]);
    return {id:data.user.id};
  };

  const handleAddPayReq=async req=>{
    const{error}=await DB.from("dj_payment_requests").insert({id:req.id,event_id:req.eventId,amount:parseFloat(req.amount)||0,label:req.label,due_date:req.dueDate||null,status:req.status});
    if(error)alert(`Couldn't add payment request: ${error.message}`);
    const{data:pr}=await DB.from("dj_payment_requests").select("*");setPayReqs(pr||[]);
  };
  const reloadPayments=async()=>{
    const{data:pm}=await DB.from("dj_payments").select("*");setPays(pm||[]);
    const{data:pr}=await DB.from("dj_payment_requests").select("*");setPayReqs(pr||[]);
  };
  const handleUpdateLead=async(id,patch)=>{
    const{error}=await DB.from("dj_leads").update(patch).eq("id",id);
    if(error){alert(`Couldn't update lead: ${error.message}`);return;}
    setLeads(ls=>ls.map(l=>l.id===id?{...l,...patch}:l));
  };
  const handleAddPayment=async p=>{
    const{error}=await DB.from("dj_payments").insert({id:p.id,event_id:p.eventId,request_id:p.requestId||null,amount:parseFloat(p.amount)||0,method:p.method||null,paid_on:p.paidOn||todayISO(),reference:p.reference||null,note:p.note||null});
    if(error){alert(`Couldn't record payment: ${error.message}`);return;}
    if(p.requestId)await DB.from("dj_payment_requests").update({status:"paid"}).eq("id",p.requestId);
    await reloadPayments();
  };
  const handleDeletePayment=async p=>{
    const{error}=await DB.from("dj_payments").delete().eq("id",p.id);
    if(error){alert(`Couldn't remove payment: ${error.message}`);return;}
    if(p.requestId)await DB.from("dj_payment_requests").update({status:"pending"}).eq("id",p.requestId);
    await reloadPayments();
  };
  const handleUpdatePayReq=async req=>{
    const{error}=req._delete?await DB.from("dj_payment_requests").delete().eq("id",req.id):await DB.from("dj_payment_requests").update({status:req.status}).eq("id",req.id);
    if(error)alert(`Couldn't update payment request: ${error.message}`);
    const{data:pr}=await DB.from("dj_payment_requests").select("*");setPayReqs(pr||[]);
  };

  // Map payment requests to camelCase
  const pReqs=payReqs.map(r=>({id:r.id,eventId:r.event_id,amount:r.amount,label:r.label,dueDate:r.due_date,status:r.status}));
  const pPays=pays.map(p=>({id:p.id,eventId:p.event_id,requestId:p.request_id,amount:p.amount,method:p.method,paidOn:p.paid_on,reference:p.reference,note:p.note}));
  const sel=events.find(e=>e.id===selId)||allEvs.find(e=>e.id===selId)||null;

  if(!CONFIGURED) return(
    <div style={{minHeight:"100vh",background:"var(--nav)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{maxWidth:"480px",width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:"32px"}}>
          <div style={{fontSize:"48px",marginBottom:"16px"}}>🎵</div>
          <h1 style={{margin:"0 0 12px",lineHeight:0}}><img src={LOGO+"wordmark-white.svg"} alt={BRAND} style={{height:"38px",width:"auto",maxWidth:"100%"}}/></h1>
          <p style={{fontSize:"14px",color:"rgba(255,255,255,.5)"}}>Setup Required</p>
        </div>
        <div style={{background:"var(--white)",borderRadius:"12px",padding:"32px"}}>
          <h2 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)",marginBottom:"16px"}}>⚙️ Add Your Supabase Keys</h2>
          <p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"20px",lineHeight:1.7}}>Open <strong>dj-planner.html</strong> in Notepad and fill in the 3 lines at the very top of the file:</p>
          <div style={{background:"var(--panel)",border:"1.5px solid var(--border)",borderRadius:"8px",padding:"16px",fontFamily:"monospace",fontSize:"13px",color:"var(--ink)",lineHeight:2,marginBottom:"20px"}}>
            <div><span style={{color:"var(--muted)"}}>const SB_URL  =</span> <strong style={{color:"var(--blue)"}}>"https://xxxx.supabase.co"</strong></div>
            <div><span style={{color:"var(--muted)"}}>const SB_ANON =</span> <strong style={{color:"var(--blue)"}}>"eyJhbGci..."</strong></div>
            <div><span style={{color:"var(--muted)"}}>const PORTAL  =</span> <strong style={{color:"var(--blue)"}}>"https://yoursite.com"</strong></div>
          </div>
          <p style={{fontSize:"13px",color:"var(--muted)",lineHeight:1.7}}>Get your keys from:<br/><strong style={{color:"var(--ink)"}}>Supabase Dashboard → Project Settings → API</strong></p>
          <div style={{marginTop:"20px",padding:"12px 14px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",borderRadius:"8px",fontSize:"12px",color:"var(--body)"}}>
            After editing, save the file and refresh this page.
          </div>
        </div>
      </div>
    </div>
  );

  if(loading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
      <div style={{textAlign:"center"}}><div className="spin" style={{margin:"0 auto 16px"}}/><p style={{fontSize:"13px",color:"var(--muted)"}}>Loading…</p></div>
    </div>
  );

  const handleResetDone = async () => {
    // After password update, Supabase already has a session — load it
    const{data:{session}}=await DB.auth.getSession();
    if(session){
      const{data:prof}=await DB.from("dj_profiles").select("*").eq("id",session.user.id).single();
      const u={...session.user,...(prof||{})};
      setUser(u);
      await loadUserData(u);
    } else {
      setScreen("auth");
    }
  };

  return(<>
    {screen==="auth"       && <Auth onLogin={handleLogin}/>}
    {screen==="reset"      && <ResetPassword onDone={handleResetDone}/>}
    {screen==="dash"       && <Dashboard user={user} events={events} onView={id=>{setSelId(id);setScreen("view");}} onEdit={id=>{setSelId(id);setScreen("edit");}} onLogout={handleLogout}/>}
    {screen==="edit"       && <EventForm event={sel} userId={user?.id} onSave={handleSaveEvent} onCancel={()=>setScreen("view")}/>}
    {screen==="view"       && <EventView event={sel} paySettings={paySet} payRequests={pReqs} payments={pPays} catalog={catalog} onEdit={()=>setScreen("edit")} onBack={()=>setScreen("dash")}/>}
    {screen==="admin"      && <AdminDashboard allEvents={allEvs} profiles={profiles} paySettings={paySet} payRequests={pReqs} payments={pPays} catalog={catalog} onSaveCatalog={handleSaveCatalog} onSelectEvent={ev=>{setSelId(ev.id);setScreen("admin_view");}} leads={leads} onUpdateLead={handleUpdateLead} onNewEvent={(cid,pre)=>{setNewFor(cid);setNewPrefill(pre||null);setSelId(null);setScreen("admin_new");}} onSavePaySettings={handleSavePaySettings} onAddClient={handleAddClient} onLogout={handleLogout}/>}
    {screen==="admin_new"  && <EventForm event={null} userId={newFor} prefill={newPrefill} clients={profiles.filter(p=>!p.is_admin)} catalog={catalog} onSave={handleSaveEvent} onCancel={()=>setScreen("admin")}/>}
    {screen==="admin_edit" && <EventForm event={sel} userId={sel?.userId} clients={profiles.filter(p=>!p.is_admin)} catalog={catalog} onSave={handleSaveEvent} onCancel={()=>setScreen("admin_view")}/>}
    {screen==="admin_view" && <AdminEventView key={sel?.id+String(sel?.updatedAt)} event={sel} notes={notesMap[sel?.id]} profiles={profiles} paySettings={paySet} payRequests={pReqs} payments={pPays} onAddPayment={handleAddPayment} onDeletePayment={handleDeletePayment} onSave={handleAdminSave} onEditDetails={()=>setScreen("admin_edit")} onAddPayReq={handleAddPayReq} onUpdatePayReq={handleUpdatePayReq} onBack={()=>setScreen("admin")}/>}
  </>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
