<head>

<title>YourWeddingsDJ — Event Portal</title>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* Black & White Elegant surfaces */
    --nav:#000000; --nav2:#0a0a0a;
    --bg:#050505; --white:#0d0d0d; --panel:#111111;
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
    /* Text */
    --ink:#f5f5f5; --body:#a0a0a0; --muted:#606060; --dim:#383838;
    /* Silver/White accent (replaces gold) */
    --gold:#d4d4d4; --g2:#ffffff; --gbg:rgba(255,255,255,.07); --gbdr:rgba(255,255,255,.2);
    /* Green */
    --green:#6ee7b7; --gbg2:rgba(110,231,183,.08); --gbdr2:rgba(110,231,183,.25);
    /* Blue */
    --blue:#93c5fd; --bbg:rgba(147,197,253,.08); --bbdr:rgba(147,197,253,.25);
    /* Red */
    --red:#fca5a5; --rbg:rgba(252,165,165,.08); --rbdr:rgba(252,165,165,.25);
    /* Purple */
    --purple:#c4b5fd; --pbg:rgba(196,181,253,.08); --pbdr:rgba(196,181,253,.25);
    --ff:'Playfair Display',Georgia,serif; --fb:'Inter',system-ui,sans-serif; --r:10px;
  }
  body{font-family:var(--fb);background:var(--bg);color:var(--ink);min-height:100vh}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--nav)}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  input,textarea,select{
    font-family:var(--fb);font-size:14px;background:rgba(255,255,255,.05);
    border:1.5px solid var(--border2);color:var(--ink);border-radius:var(--r);
    padding:11px 14px;width:100%;outline:none;transition:border-color .18s,box-shadow .18s;
    -webkit-appearance:none; color-scheme:dark;
  }
  input:focus,textarea:focus,select:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.07);background:rgba(255,255,255,.03)}
  input::placeholder,textarea::placeholder{color:var(--dim)}
  select option{background:#1a1a28}
  textarea{resize:vertical;min-height:80px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .fade{animation:fadeUp .25s cubic-bezier(.22,1,.36,1) forwards}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--r);font-family:var(--fb);font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:all .18s;line-height:1;white-space:nowrap;text-decoration:none;letter-spacing:.01em}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .b-gold{background:#fff;color:#000;box-shadow:0 2px 16px rgba(255,255,255,.12)}.b-gold:hover:not(:disabled){background:#e8e8e8;box-shadow:0 4px 24px rgba(255,255,255,.2);transform:translateY(-1px)}
  .b-out{background:rgba(255,255,255,.04);border:1.5px solid var(--border2);color:var(--body)}.b-out:hover:not(:disabled){border-color:rgba(255,255,255,.4);color:var(--ink);background:rgba(255,255,255,.07)}
  .b-ghost{background:transparent;color:var(--muted)}.b-ghost:hover{color:var(--ink)}
  .b-nav{background:transparent;border:none;color:rgba(255,255,255,.5);padding:6px 10px;font-size:13px;cursor:pointer;font-family:var(--fb);transition:color .15s}.b-nav:hover{color:#fff}
  .b-danger{background:transparent;border:1.5px solid var(--rbdr);color:var(--red)}.b-danger:hover{background:var(--rbg)}
  .b-purple{background:#6d28d9;color:#fff}.b-purple:hover{background:#7c3aed}
  .b-green{background:#15803d;color:#fff}.b-green:hover{background:#16a34a}
  /* Layout */
  .card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 1px 20px rgba(0,0,0,.4)}
  .lbl{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .fg{display:flex;flex-direction:column;gap:5px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  @media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
  /* Badges */
  .badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .st-draft{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1)}
  .st-submitted{background:var(--bbg);color:var(--blue);border:1px solid var(--bbdr)}
  .st-confirmed{background:var(--gbg2);color:var(--green);border:1px solid var(--gbdr2)}
  /* Admin badge */
  .adm{padding:3px 9px;border-radius:20px;background:var(--purple);color:#fff;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.9}
  /* Song card */
  .sc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .18s}
  .sc:focus-within{border-color:rgba(255,255,255,.25)}
  .sc-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  /* Timeline row */
  .tl{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:90px 1fr 1fr 34px;gap:10px;align-items:end;margin-bottom:8px;transition:border-color .18s}
  .tl:focus-within{border-color:rgba(255,255,255,.22)}
  @media(max-width:600px){.tl{grid-template-columns:1fr}}
  /* Vibe chip */
  .vc{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;user-select:none;transition:all .16s;font-weight:500}
  .vc-on{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.6);color:#fff;font-weight:600;box-shadow:0 0 12px rgba(255,255,255,.08)}
  .vc-off{background:rgba(255,255,255,.04);border:1.5px solid var(--border2);color:var(--body)}.vc-off:hover{border-color:rgba(255,255,255,.35);color:var(--ink)}
  /* Toggle */
  .tog{position:relative;width:46px;height:26px;cursor:pointer;flex-shrink:0;display:inline-block}
  .tog-track{width:100%;height:100%;border-radius:13px;transition:background .2s;border:1px solid rgba(255,255,255,.1)}
  .tog-thumb{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 6px rgba(0,0,0,.5)}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px}
  /* Spinner */
  .spin{width:34px;height:34px;border:2.5px solid rgba(255,255,255,.08);border-top-color:rgba(255,255,255,.7);border-radius:50%;animation:spin 1s linear infinite}
  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .cal-hd{text-align:center;padding:9px 2px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--border)}
  .cal-cell{min-height:86px;border:1px solid var(--border);padding:5px;background:var(--white)}
  .cal-today{background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.25)!important}
  .cal-blank{background:rgba(0,0,0,.2)}
  .cal-ev{font-size:10.5px;padding:3px 6px;border-radius:5px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-ev:hover{opacity:.75}
  @media(max-width:600px){.cal-cell{min-height:58px;padding:3px}.cal-ev{font-size:9px;padding:2px 3px}.cal-hd{font-size:9px;letter-spacing:0}}
  /* Tabs */
  .tab{padding:11px 22px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-left:none;border-right:none;border-top:none;font-family:var(--fb);transition:color .15s,border-color .15s;color:var(--muted);font-weight:500}
  .tab.on{border-bottom-color:#fff;color:#fff;font-weight:600}
  .tab.off{color:var(--muted)}.tab.off:hover{color:var(--body)}
  /* Pay method */
  .pm{border:1px solid var(--border);border-radius:14px;padding:18px 22px;background:rgba(255,255,255,.03);margin-bottom:12px;transition:border-color .18s,background .18s}
  .pm.on{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  .hide-sm{}
  @media(max-width:600px){.hide-sm{display:none!important}}
  .tbl-scroll{overflow-x:auto}.tbl-scroll>div{min-width:720px}
  /* Divider */
  hr{border:none;border-top:1px solid var(--border);margin:20px 0}
</style>
</head>

  return (
    <div style={{background:"var(--nav2)",borderRadius:"14px",padding:"clamp(20px,4vw,36px)",marginBottom:"18px"}} className="fade">

const AuthShell = ({children}) => (
  <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative",overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,.018) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,.018) 60px)",pointerEvents:"none"}}/>

        <h1 style={{fontFamily:"var(--ff)",fontSize:"clamp(26px,5vw,36px)",fontWeight:400,color:"#fff",letterSpacing:"-.01em",lineHeight:1.1}}>{BRAND}</h1>

      <p style={{textAlign:"center",marginTop:"24px",fontSize:"12px",color:"rgba(255,255,255,.2)",lineHeight:1.8}}>
        Need access? Contact your DJ at<br/>
        <span style={{color:"rgba(255,255,255,.4)"}}>bryon@yourweddingsdj.com</span>
      </p>
    </div>
  </div>
);

function Auth({onLogin}){
  const[view,setView]       =useState("login"); // "login" | "forgot" | "sent"
  const[email,setEmail]     =useState("");
  const[pw,setPw]           =useState("");
  const[err,setErr]         =useState("");
  const[busy,setBusy]       =useState(false);

  const go = async () => {
    if(!email||!pw) return;
    setErr(""); setBusy(true);
    const{data,error}=await DB.auth.signInWithPassword({email,password:pw});
    if(error){setErr("Incorrect email or password. Please try again.");setBusy(false);return;}
    const{data:prof}=await DB.from("dj_profiles").select("*").eq("id",data.user.id).single();
    onLogin({...data.user,...(prof||{})});
  };

  const sendReset = async () => {
    if(!email) return;
    setErr(""); setBusy(true);
    const redirectTo = window.location.origin + window.location.pathname;
    await DB.auth.resetPasswordForEmail(email, {redirectTo});
    setBusy(false);
    setView("sent");
  };


  if(view==="sent") return (
    <AuthShell>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.09)",borderRadius:"16px",padding:"clamp(28px,5vw,40px)",textAlign:"center"}}>
        <h2 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"#fff",marginBottom:"10px"}}>Check your inbox</h2>
        <p style={{fontSize:"13px",color:"rgba(255,255,255,.45)",marginBottom:"24px",lineHeight:1.7}}>
          If <strong style={{color:"rgba(255,255,255,.7)"}}>{email}</strong> is registered, you'll receive a password reset link shortly.
        </p>
        <button className="btn b-nav" onClick={()=>{setView("login");setErr("");}} style={{width:"100%",justifyContent:"center",padding:"11px",fontSize:"13px"}}>
          ← Back to Sign In
        </button>
      </div>
    </AuthShell>
  );

  if(view==="forgot") return (
    <AuthShell>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.09)",borderRadius:"16px",padding:"clamp(28px,5vw,40px)"}}>
        <h2 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"#fff",marginBottom:"4px"}}>Reset password</h2>
        <p style={{fontSize:"13px",color:"rgba(255,255,255,.35)",marginBottom:"26px"}}>Enter your email and we'll send a reset link</p>
        <ErrBox msg={err}/>
        <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
          <div className="fg">
            <label className="lbl">Email Address</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==="Enter"&&sendReset()} autoComplete="email"/>
          </div>
          <button className="btn b-gold" onClick={sendReset} disabled={busy||!email} style={{width:"100%",justifyContent:"center",padding:"13px",fontSize:"14px",fontWeight:600,marginTop:"4px"}}>
            {busy?<span style={{animation:"pulse 1s infinite"}}>Sending…</span>:"Send Reset Link →"}
          </button>
          <button onClick={()=>{setView("login");setErr("");}} style={{background:"none",border:"none",color:"rgba(255,255,255,.3)",fontSize:"13px",cursor:"pointer",padding:"4px 0",textAlign:"center"}}>
            ← Back to Sign In
          </button>
        </div>
      </div>
    </AuthShell>
  );

  return (
    <AuthShell>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.09)",borderRadius:"16px",padding:"clamp(28px,5vw,40px)"}}>
        <h2 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"#fff",marginBottom:"4px"}}>Welcome back</h2>
        <p style={{fontSize:"13px",color:"rgba(255,255,255,.35)",marginBottom:"26px"}}>Sign in to your event portal</p>
        <ErrBox msg={err}/>
        <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
          <div className="fg">
            <label className="lbl">Email Address</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="email"/>
          </div>
          <div className="fg">
            <label className="lbl" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              Password
              <button onClick={()=>{setErr("");setView("forgot");}} style={{background:"none",border:"none",color:"rgba(255,255,255,.3)",fontSize:"11px",cursor:"pointer",padding:0,fontFamily:"var(--fb)",letterSpacing:".02em"}}>
                Forgot password?
              </button>
            </label>
            <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&go()} autoComplete="current-password"/>
          </div>
          <button className="btn b-gold" onClick={go} disabled={busy||!email||!pw} style={{width:"100%",justifyContent:"center",padding:"13px",fontSize:"14px",fontWeight:600,marginTop:"4px"}}>
            {busy?<span style={{animation:"pulse 1s infinite"}}>Signing in…</span>:"Sign In →"}
          </button>
        </div>
      </div>
    </AuthShell>
  );
}

// ════════════════════════════════════════════════
// RESET PASSWORD (Supabase recovery redirect)
// ════════════════════════════════════════════════
function ResetPassword({onDone}){
  const[pw,setPw]   =useState("");
  const[pw2,setPw2] =useState("");
  const[err,setErr] =useState("");
  const[ok,setOk]   =useState(false);
  const[busy,setBusy]=useState(false);

  const submit = async () => {
    if(!pw||!pw2){setErr("Please fill in both fields.");return;}
    if(pw!==pw2){setErr("Passwords don't match.");return;}
    if(pw.length<8){setErr("Password must be at least 8 characters.");return;}
    setErr(""); setBusy(true);
    const{error}=await DB.auth.updateUser({password:pw});
    setBusy(false);
    if(error){setErr(error.message||"Something went wrong. Try again.");return;}
    setOk(true);
    setTimeout(()=>onDone(),2200);
  };

  return (
    <div style={{minHeight:"100vh",background:"#000",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative",overflow:"hidden"}}>
      <div style={{position:"absolute",inset:0,backgroundImage:"repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,.018) 60px),repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,.018) 60px)",pointerEvents:"none"}}/>
      <div className="fade" style={{width:"100%",maxWidth:"400px",position:"relative"}}>
        <div style={{textAlign:"center",marginBottom:"48px"}}>
          <p style={{fontFamily:"var(--ff)",fontSize:"10px",fontWeight:400,letterSpacing:".4em",textTransform:"uppercase",color:"rgba(255,255,255,.3)",marginBottom:"16px"}}>Private Client Portal</p>
          <h1 style={{fontFamily:"var(--ff)",fontSize:"clamp(26px,5vw,36px)",fontWeight:400,color:"#fff",letterSpacing:"-.01em",lineHeight:1.1}}>{BRAND}</h1>
          <div style={{width:"36px",height:"1px",background:"rgba(255,255,255,.2)",margin:"16px auto 0"}}/>
        </div>
        {ok ? (
          <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.09)",borderRadius:"16px",padding:"clamp(28px,5vw,40px)",textAlign:"center"}}>
            <div style={{fontSize:"36px",marginBottom:"16px"}}>✅</div>
            <h2 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"#fff",marginBottom:"8px"}}>Password updated</h2>
            <p style={{fontSize:"13px",color:"rgba(255,255,255,.4)"}}>Signing you in…</p>
          </div>
        ) : (
          <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.09)",borderRadius:"16px",padding:"clamp(28px,5vw,40px)"}}>
            <h2 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"#fff",marginBottom:"4px"}}>Set new password</h2>
            <p style={{fontSize:"13px",color:"rgba(255,255,255,.35)",marginBottom:"26px"}}>Choose a strong password for your account</p>
            <ErrBox msg={err}/>
            <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
              <div className="fg">
                <label className="lbl">New Password</label>
                <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Min. 8 characters" autoComplete="new-password"/>
              </div>
              <div className="fg">
                <label className="lbl">Confirm Password</label>
                <input type="password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&submit()} autoComplete="new-password"/>
              </div>
              <button className="btn b-gold" onClick={submit} disabled={busy||!pw||!pw2} style={{width:"100%",justifyContent:"center",padding:"13px",fontSize:"14px",fontWeight:600,marginTop:"4px"}}>
                {busy?<span style={{animation:"pulse 1s infinite"}}>Saving…</span>:"Update Password →"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

    <div className="g3"><div className="fg"><label className="lbl">City</label><input value={d.venueCity} onChange={e=>u({venueCity:e.target.value})}/></div><div className="fg"><label className="lbl">State</label><input value={d.venueState} onChange={e=>u({venueState:e.target.value})} maxLength={2}/></div><div className="fg"><label className="lbl">ZIP</label><input value={d.venueZip} onChange={e=>u({venueZip:e.target.value})}/></div></div>

  </div>
</div>);}

function Step4({d,u}){
  const set=(i,k,v)=>{const t=[...d.timeline];t[i]={...t[i],[k]:v};u({timeline:t});};
  return(<div className="fade">
    <StepHeader title="Event Timeline" sub="Walk us through the flow of your event. Times can be approximate."/>
    {d.timeline.map((item,i)=>(
      <div key={i} className="tl">
        <div className="fg">{i===0&&<label className="lbl" style={{fontSize:"9px"}}>Time</label>}<input type="time" value={item.time} onChange={e=>set(i,"time",e.target.value)} style={{padding:"8px 9px",fontSize:"13px"}}/></div>
        <div className="fg">{i===0&&<label className="lbl" style={{fontSize:"9px"}}>Milestone</label>}<input value={item.label} onChange={e=>set(i,"label",e.target.value)} placeholder="What's happening?" style={{fontSize:"13px"}}/></div>
        <div className="fg">{i===0&&<label className="lbl" style={{fontSize:"9px"}}>Notes</label>}<input value={item.note} onChange={e=>set(i,"note",e.target.value)} placeholder="Details…" style={{fontSize:"13px"}}/></div>
        <button className="btn b-ghost" onClick={()=>u({timeline:d.timeline.filter((_,j)=>j!==i)})} style={{padding:"7px",fontSize:"17px",color:"var(--red)",lineHeight:1,alignSelf:"flex-end"}}>×</button>

    ))}

// SongRow / SongList live OUTSIDE the step components so inputs keep focus while typing
function SongRow({d,u,label,sk,ak}){return(<div className="sc"><p className="sc-lbl">{label}</p><div className="g2"><div className="fg"><label className="lbl">Song Title</label><input value={d[sk]||""} onChange={e=>u({[sk]:e.target.value})} placeholder="Leave blank for a suggestion…"/></div><div className="fg"><label className="lbl">Artist</label><input value={d[ak]||""} onChange={e=>u({[ak]:e.target.value})} placeholder="Artist name…"/></div></div></div>);}

function Step5({d,u}){
  const t=d.eventType;
  return(<div className="fade">
    <StepHeader title="Music Planning" sub="Fill in the songs you've chosen. Leave any field blank if you haven't decided yet."/>

      {t==="wedding"&&<><SongRow d={d} u={u} label="First Dance" sk="firstDanceSong" ak="firstDanceArtist"/><SongRow d={d} u={u} label="Father / Daughter Dance" sk="fatherDaughterSong" ak="fatherDaughterArtist"/><SongRow d={d} u={u} label="Mother / Son Dance" sk="motherSonSong" ak="motherSonArtist"/><SongRow d={d} u={u} label="Bridal Party Entrance" sk="partyEntranceSong" ak="partyEntranceArtist"/><SongRow d={d} u={u} label="Grand Entrance (Couple)" sk="grandEntranceSong" ak="grandEntranceArtist"/><SongRow d={d} u={u} label="Cake Cutting" sk="cakeCuttingSong" ak="cakeCuttingArtist"/><SongRow d={d} u={u} label="Bouquet Toss" sk="bouquetSong" ak="bouquetArtist"/><SongRow d={d} u={u} label="Garter" sk="garterSong" ak="garterArtist"/><SongRow d={d} u={u} label="Last Dance" sk="lastDanceSong" ak="lastDanceArtist"/></>}
      {(t==="bar_mitzvah"||t==="bat_mitzvah")&&<>
        <SongRow d={d} u={u} label="Grand Entrance" sk="grandEntranceSong" ak="grandEntranceArtist"/>
        <SongRow d={d} u={u} label="Hora" sk="horaSong" ak="horaArtist"/>
        <SongRow d={d} u={u} label="Last Dance" sk="lastDanceSong" ak="lastDanceArtist"/>
        <div className="sc"><p className="sc-lbl">Candle Lighting Ceremony</p>
          <p style={{fontSize:"12px",color:"var(--muted)",marginBottom:"12px"}}>Up to 13 candles — enter the honoree and their song.</p>
          <div style={{display:"grid",gridTemplateColumns:"28px 1fr 1fr 1fr",gap:"7px",marginBottom:"6px"}}>
            <div/><label className="lbl" style={{fontSize:"9px"}}>Honoree</label><label className="lbl" style={{fontSize:"9px"}}>Song</label><label className="lbl" style={{fontSize:"9px"}}>Artist</label>
          </div>
          {d.candleLighting.map((c,i)=>{const upd=(k,v)=>{const cl=[...d.candleLighting];cl[i]={...cl[i],[k]:v};u({candleLighting:cl});};return(
            <div key={i} style={{display:"grid",gridTemplateColumns:"28px 1fr 1fr 1fr",gap:"7px",alignItems:"center",marginBottom:"7px"}}>
              <div style={{textAlign:"center",fontFamily:"var(--ff)",fontSize:"15px",color:"var(--gold)",fontWeight:600}}>{i+1}</div>
              <input value={c.honoree} onChange={e=>upd("honoree",e.target.value)} placeholder="Name…" style={{fontSize:"12px"}}/>
              <input value={c.song}    onChange={e=>upd("song",e.target.value)}    placeholder="Song…" style={{fontSize:"12px"}}/>
              <input value={c.artist}  onChange={e=>upd("artist",e.target.value)}  placeholder="Artist…" style={{fontSize:"12px"}}/>
            </div>
          );})}
        </div>
      </>}
      {t==="school_dance"&&<><SongRow d={d} u={u} label="Grand Entrance" sk="grandEntranceSong" ak="grandEntranceArtist"/><SongRow d={d} u={u} label="Coronation Song" sk="openingSong" ak="openingArtist"/><SongRow d={d} u={u} label="Last Dance" sk="lastDanceSong" ak="lastDanceArtist"/></>}
      {(t==="birthday"||t==="sweet_16"||t==="corporate"||t==="other")&&<>
        <SongRow d={d} u={u} label="Grand Entrance" sk="grandEntranceSong" ak="grandEntranceArtist"/>
        {(t==="birthday"||t==="sweet_16")&&<SongRow d={d} u={u} label="Cake Cutting" sk="cakeCuttingSong" ak="cakeCuttingArtist"/>}
        <SongRow d={d} u={u} label="Opening Song" sk="openingSong" ak="openingArtist"/>
        <SongRow d={d} u={u} label="Last Dance" sk="lastDanceSong" ak="lastDanceArtist"/>
      </>}
      {!t&&<div style={{textAlign:"center",padding:"50px 24px",background:"var(--panel)",borderRadius:"10px",border:"1.5px dashed var(--border)",color:"var(--muted)",fontSize:"13px"}}>← Select an event type in Step 1 to unlock music planning</div>}
    </div>
  </div>);}

function SongList({d,u,arr,icon,title}){
  const updArr=(i,k,v)=>{const a=[...d[arr]];a[i]={...a[i],[k]:v};u({[arr]:a});};
  return(

          <input value={item.artist} onChange={e=>updArr(i,"artist",e.target.value)} placeholder="Artist…"/>
          <button className="btn b-ghost" onClick={()=>u({[arr]:d[arr].filter((_,j)=>j!==i)})} disabled={d[arr].length===1} style={{padding:"8px",fontSize:"16px",color:"var(--red)",lineHeight:1}}>×</button>
        </div>
      ))}
      <button className="btn b-out" onClick={()=>u({[arr]:[...d[arr],{song:"",artist:""}]})} style={{fontSize:"12px",padding:"7px 13px"}}>+ Add Song</button>
    </div>
  );}

function Step6({d,u}){
  const tVibe=v=>u({vibes:d.vibes.includes(v)?d.vibes.filter(x=>x!==v):[...d.vibes,v]});
  return(<div className="fade">
    <StepHeader title="Song Requests & Preferences" sub="Must-plays, do-not-plays, and the vibe you're going for."/>

      <div style={{display:"flex",flexWrap:"wrap",gap:"8px"}}>
        {VIBES.map(v=><div key={v} className={`vc ${d.vibes.includes(v)?"vc-on":"vc-off"}`} onClick={()=>tVibe(v)}>{v}</div>)}
      </div>
    </div>

    <SongList d={d} u={u} arr="doNotPlay" icon="" title="Do Not Play"/>
    <div className="fg"><label className="lbl">Special Requests & Notes</label><textarea value={d.specialRequests} onChange={e=>u({specialRequests:e.target.value})} placeholder="Announcements, surprises, second contact, accessibility needs, or anything else we should know…" style={{minHeight:"100px"}}/></div>
  </div>);}

function Step7({d}){
  const m=meta(d.eventType);
  return(<div className="fade">
    <StepHeader title="Review Your Submission" sub="Everything look good? Click any step above or Back to make changes."/>
    <div style={{display:"flex",alignItems:"center",gap:"14px",padding:"18px 20px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",borderRadius:"12px",marginBottom:"18px"}}>
      <span style={{fontSize:"28px"}}>{m.e}</span>
      <div><p style={{fontSize:"10px",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",color:"var(--gold)"}}>{m.label}</p><h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)"}}>{d.eventName||"Unnamed Event"}</h3></div>
    </div>
    <Sec title="Event Details"><Row l="Date" v={d.eventDate?fDate(d.eventDate):null}/><Row l="Time" v={d.startTime?`${f12(d.startTime)}${d.endTime?` – ${f12(d.endTime)}`:""}`:null}/><Row l="Guests" v={d.guestCount?`${d.guestCount} expected`:null}/></Sec>
    <Sec title="Contact"><Row l="Name" v={d.clientName}/><Row l="Email" v={d.email}/><Row l="Phone" v={d.phone}/></Sec>
    <Sec title="Venue"><Row l="Venue" v={d.venueName}/><Row l="Address" v={[d.venueAddress,d.venueCity,d.venueState,d.venueZip].filter(Boolean).join(", ")||null}/><Row l="Coordinator" v={d.venueContact}/></Sec>
    {d.timeline.length>0&&<Sec title="Timeline">{d.timeline.map((item,i)=><Row key={i} l={item.time?f12(item.time):"—"} v={item.label+(item.note?` · ${item.note}`:"")}/>)}</Sec>}
    <Sec title="Special Songs">
      <Song l="Grand Entrance" s={d.grandEntranceSong} a={d.grandEntranceArtist}/>
      {d.eventType==="wedding"&&<><Song l="First Dance" s={d.firstDanceSong} a={d.firstDanceArtist}/><Song l="Father/Daughter" s={d.fatherDaughterSong} a={d.fatherDaughterArtist}/><Song l="Mother/Son" s={d.motherSonSong} a={d.motherSonArtist}/><Song l="Bridal Party" s={d.partyEntranceSong} a={d.partyEntranceArtist}/><Song l="Cake Cutting" s={d.cakeCuttingSong} a={d.cakeCuttingArtist}/></>}
      {(d.eventType==="bar_mitzvah"||d.eventType==="bat_mitzvah")&&<Song l="Hora" s={d.horaSong} a={d.horaArtist}/>}
      <Song l="Opening Song" s={d.openingSong} a={d.openingArtist}/>
      <Song l="Last Dance"   s={d.lastDanceSong} a={d.lastDanceArtist}/>
    </Sec>
    {d.mustPlay.some(s=>s.song)&&<Sec title="Must-Play">{d.mustPlay.filter(s=>s.song).map((s,i)=><div key={i} style={{fontSize:"13px",marginBottom:"6px",color:"var(--ink)"}}><span style={{color:"var(--gold)"}}>♪ </span>{s.song}{s.artist&&<span style={{color:"var(--muted)"}}> — {s.artist}</span>}</div>)}</Sec>}
    {d.vibes.length>0&&<Sec title="Vibes"><div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>{d.vibes.map(v=><span key={v} style={{padding:"4px 11px",borderRadius:"20px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",color:"var(--gold)",fontSize:"12px",fontWeight:600}}>{v}</span>)}</div></Sec>}
    {d.specialRequests&&<Sec title="Special Requests"><p style={{fontSize:"13px",color:"var(--ink)",lineHeight:1.75}}>{d.specialRequests}</p></Sec>}
    <OkBox msg="Review the details above, then click Submit. We'll follow up to confirm everything."/>
  </div>);}

function EventForm({event,userId,onSave,onCancel}){
  const[step,setStep]=useState(1);
  const[data,setData]=useState(()=>event?{...blankEv(),...event}:blankEv());
  const[saving,setSaving]=useState(false);
  const u=useCallback(c=>setData(p=>({...p,...c})),[]);
  const save=async draft=>{setSaving(true);await onSave({...data,status:draft?"draft":"submitted",id:data.id||uid(),userId});setSaving(false);};
  const steps=[<Step1 d={data} u={u}/>,<Step2 d={data} u={u}/>,<Step3 d={data} u={u}/>,<Step4 d={data} u={u}/>,<Step5 d={data} u={u}/>,<Step6 d={data} u={u}/>,<Step7 d={data}/>];
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)"}}>
      <header style={{background:"var(--nav)",padding:"0 24px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.28)"}}>
        <div style={{maxWidth:"880px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:"58px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <button className="btn b-nav" onClick={onCancel} style={{padding:"6px 10px",fontSize:"19px",lineHeight:1}}>←</button>
            <span style={{fontFamily:"var(--ff)",fontSize:"17px",color:"#fff",fontWeight:400,whiteSpace:"nowrap"}}>{event?.id?"Edit Event":"New Event"}</span>
            {data.eventName&&<span className="hide-sm" style={{fontSize:"12px",color:"rgba(255,255,255,.4)"}}>— {data.eventName}</span>}
          </div>
          <button className="btn b-out" onClick={()=>save(true)} disabled={saving} style={{padding:"7px 14px",fontSize:"12px",background:"rgba(255,255,255,.1)",borderColor:"rgba(255,255,255,.25)",color:"rgba(255,255,255,.85)"}}>Save Draft</button>
        </div>
      </header>
      {/* Step tabs */}
      <div style={{background:"var(--nav2)",borderBottom:"1px solid rgba(255,255,255,.1)",overflowX:"auto",position:"sticky",top:"58px",zIndex:99}}>
        <div style={{maxWidth:"880px",margin:"0 auto",display:"flex",minWidth:"max-content"}}>
          {STEPS.map((s,i)=>{const n=i+1,active=n===step,done=n<step;return(
            <div key={n} ref={el=>{if(active&&el)el.scrollIntoView({block:"nearest",inline:"nearest"});}} onClick={()=>setStep(n)} style={{display:"flex",alignItems:"center",gap:"6px",padding:"12px 15px",cursor:"pointer",flexShrink:0,borderBottom:`2px solid ${active?"var(--gold)":"transparent"}`,color:active?"#fff":done?"rgba(255,255,255,.55)":"rgba(255,255,255,.3)",fontSize:"13px",fontWeight:active?600:400}}>
              <span>{done?"✓":s.i}</span><span style={{whiteSpace:"nowrap"}}>{s.l}</span>
            </div>
          );})}
        </div>
      </div>
      {/* Progress bar */}
      <div style={{height:"3px",background:"var(--border)"}}><div style={{height:"100%",background:"var(--gold)",width:`${(step/7)*100}%`,transition:"width .3s ease"}}/></div>
      {/* Content */}
      <div style={{maxWidth:"880px",margin:"0 auto",padding:"28px 24px"}}>
        <div className="card" style={{boxShadow:"0 1px 8px rgba(0,0,0,.07)"}}>{steps[step-1]}</div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:"18px"}}>
          <button className="btn b-out" onClick={()=>setStep(s=>Math.max(1,s-1))} style={{visibility:step===1?"hidden":"visible"}}>← Back</button>
          <div style={{display:"flex",gap:"10px"}}>
            {step<7
              ? <button className="btn b-gold" onClick={()=>setStep(s=>s+1)} style={{padding:"10px 24px"}}>{STEPS[step].l} →</button>
              : <><button className="btn b-out" onClick={()=>save(true)} disabled={saving}>Save as Draft</button><button className="btn b-gold" onClick={()=>save(false)} disabled={saving} style={{padding:"10px 26px"}}>{saving?<span style={{animation:"pulse 1s infinite"}}>Saving…</span>:"Submit Event"}</button></>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

function EventView({event,paySettings,payRequests,onEdit,onBack}){

  return(

        {event.timeline?.length>0&&<Sec title="Timeline">{event.timeline.map((item,i)=>(<div key={i} style={{display:"flex",gap:"14px",padding:"8px 0",borderBottom:i<event.timeline.length-1?"1px solid var(--border)":"none"}}><span style={{width:"66px",flexShrink:0,color:"var(--gold)",fontSize:"12.5px",fontWeight:600}}>{item.time?f12(item.time):"—"}</span><div><div style={{fontSize:"13px",color:"var(--ink)"}}>{item.label}</div>{item.note&&<div style={{fontSize:"12px",color:"var(--muted)"}}>{item.note}</div>}</div></div>))}</Sec>}
        <Sec title="Special Songs">
          <Song l="Grand Entrance" s={event.grandEntranceSong} a={event.grandEntranceArtist}/>

          <Song l="Last Dance"   s={event.lastDanceSong} a={event.lastDanceArtist}/>
        </Sec>
        {event.mustPlay?.some(s=>s.song)&&<Sec title="Must-Play Songs">{event.mustPlay.filter(s=>s.song).map((s,i)=><div key={i} style={{display:"flex",gap:"7px",marginBottom:"6px",fontSize:"13px"}}><span style={{color:"var(--gold)"}}>♪</span><span style={{color:"var(--ink)"}}>{s.song}</span>{s.artist&&<span style={{color:"var(--muted)"}}>— {s.artist}</span>}</div>)}</Sec>}
        {event.doNotPlay?.some(s=>s.song)&&<Sec title="Do Not Play">{event.doNotPlay.filter(s=>s.song).map((s,i)=><div key={i} style={{display:"flex",gap:"7px",marginBottom:"6px",fontSize:"13px"}}><span style={{color:"var(--red)"}}>✕</span><span style={{color:"var(--ink)"}}>{s.song}</span>{s.artist&&<span style={{color:"var(--muted)"}}>— {s.artist}</span>}</div>)}</Sec>}
        {event.vibes?.length>0&&<Sec title="Music Vibes"><div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>{event.vibes.map(v=><span key={v} style={{padding:"4px 11px",borderRadius:"20px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",color:"var(--gold)",fontSize:"12px",fontWeight:600}}>{v}</span>)}</div></Sec>}
        {event.specialRequests&&<Sec title="Special Requests"><p style={{fontSize:"13px",color:"var(--ink)",lineHeight:1.75}}>{event.specialRequests}</p></Sec>}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════
// ADMIN CALENDAR
// ════════════════════════════════════════════════
function CalendarView({events,onSelect}){
  const[view,setView]=useState(()=>{const n=new Date();return{y:n.getFullYear(),m:n.getMonth()};});
  const{y,m}=view;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const label=new Date(y,m,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const byDate={};events.forEach(ev=>{if(ev.eventDate){if(!byDate[ev.eventDate])byDate[ev.eventDate]=[];byDate[ev.eventDate].push(ev);}});
  const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
  const evSt=s=>({confirmed:{bg:"var(--gbg2)",c:"var(--green)",b:"var(--gbdr2)"},submitted:{bg:"var(--bbg)",c:"var(--blue)",b:"var(--bbdr)"},draft:{bg:"rgba(255,255,255,.05)",c:"var(--body)",b:"var(--border2)"}}[s||"draft"]);
  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"16px"}}>
      <button className="btn b-out" onClick={()=>setView(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1})} style={{padding:"7px 14px",fontSize:"13px"}}>← Prev</button>
      <h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)"}}>{label}</h3>
      <button className="btn b-out" onClick={()=>setView(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1})} style={{padding:"7px 14px",fontSize:"13px"}}>Next →</button>
    </div>
    <div className="cal-grid">
      {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} className="cal-hd">{d}</div>)}
      {cells.map((day,i)=>{
        if(!day) return <div key={`b${i}`} className="cal-cell cal-blank"/>;
        const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const evs=byDate[ds]||[];
        return(<div key={ds} className={`cal-cell${ds===today?" cal-today":""}`}>
          <div style={{fontSize:"12px",fontWeight:ds===today?700:400,color:ds===today?"var(--gold)":"var(--body)",marginBottom:"3px",textAlign:"right",paddingRight:"2px"}}>{day}</div>
          {evs.slice(0,3).map(ev=>{const st=evSt(ev.status);const m2=meta(ev.eventType);return(
            <div key={ev.id} className="cal-ev" onClick={()=>onSelect(ev)} style={{background:st.bg,color:st.c,border:`1px solid ${st.b}`}}>{m2.e} {ev.eventName||"Event"}{ev.startTime&&<span style={{opacity:.7}}> · {f12(ev.startTime)}</span>}</div>
          );})}
          {evs.length>3&&<div style={{fontSize:"10px",color:"var(--muted)"}}>+{evs.length-3} more</div>}
        </div>);
      })}
    </div>
    <div style={{display:"flex",gap:"16px",marginTop:"10px",flexWrap:"wrap"}}>
      {[["var(--gbg2)","var(--green)","var(--gbdr2)","Confirmed"],["var(--bbg)","var(--blue)","var(--bbdr)","Submitted"],["rgba(255,255,255,.05)","var(--body)","var(--border2)","Draft"]].map(([bg,c,b,l])=>(
        <div key={l} style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"12px",color:"var(--muted)"}}><div style={{width:12,height:12,borderRadius:3,background:bg,border:`1px solid ${b}`}}/>{l}</div>
      ))}
    </div>
  </div>);}

// PayToggle — must live OUTSIDE AdminDashboard so inputs don't reset on every keystroke
function PayToggle({id,label,icon,desc,field,placeholder,lps,setLps,setPdirty}){
  const on=lps.methods?.[id];
  return(
    <div className={`pm${on?" on":""}`}>
      <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:on?"14px":"0"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:"14px",fontWeight:600,color:"var(--ink)"}}>{label}</div>
          <div style={{fontSize:"12px",color:"var(--muted)"}}>{desc}</div>
        </div>
        <Toggle on={!!on} set={v=>{setLps(p=>({...p,methods:{...p.methods,[id]:v}}));setPdirty(true);}}/>
      </div>
      {on&&(
        <div style={{paddingTop:"12px",borderTop:"1px solid var(--gbdr)"}}>
          <div className="fg">
            <label className="lbl">{label} Handle / Info</label>
            <input
              value={lps[field]||""}
              onChange={e=>{const v=e.target.value;setLps(p=>({...p,[field]:v}));setPdirty(true);}}
              placeholder={placeholder}
            />
          </div>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════
// ADMIN DASHBOARD
// ════════════════════════════════════════════════
function AdminDashboard({allEvents,profiles,paySettings,payRequests,onSelectEvent,onSavePaySettings,onAddClient,onLogout}){
  const[tab,setTab]=useState("calendar");
  const[filter,setFilter]=useState({status:"all",type:"all",search:"",uid:"all"});
  const[lps,setLps]=useState(paySettings||BLANK_PAY);
  const[pdirty,setPdirty]=useState(false);
  const[psaving,setPsaving]=useState(false);
  const[cmodal,setCmodal]=useState(false);
  const[credmodal,setCredmodal]=useState(null);
  const[cf,setCf]=useState({name:"",email:"",password:""});
  const[cfErr,setCfErr]=useState("");

  const today=new Date().toISOString().slice(0,10);
  const counts={total:allEvents.length,upcoming:allEvents.filter(e=>e.eventDate>=today).length,confirmed:allEvents.filter(e=>e.status==="confirmed").length,submitted:allEvents.filter(e=>e.status==="submitted").length,clients:profiles.length};

  const filtered=allEvents.filter(ev=>{
    if(filter.status!=="all"&&ev.status!==filter.status)return false;
    if(filter.type!=="all"&&ev.eventType!==filter.type)return false;
    if(filter.uid!=="all"&&ev.userId!==filter.uid)return false;
    if(filter.search){const q=filter.search.toLowerCase();if(!`${ev.eventName} ${ev.clientName} ${ev.venueName}`.toLowerCase().includes(q))return false;}
    return true;
  });

  const SBox=({l,v,bg,c})=><div style={{background:bg,borderRadius:"10px",padding:"16px 20px"}}><div style={{fontSize:"26px",fontWeight:700,color:c,fontFamily:"var(--ff)"}}>{v}</div><div style={{fontSize:"11px",color:c,opacity:.8,fontWeight:600,textTransform:"uppercase",letterSpacing:".07em",marginTop:"2px"}}>{l}</div></div>;
  const cText=(name,email,pw)=>`Hi ${name},\n\nYour ${BRAND} event planning portal account is ready.\n\nLogin URL: ${PORTAL}\nEmail: ${email}\nPassword: ${pw}\n\nLog in to start planning your event.`;

  const handleAddClient=async()=>{
    if(!cf.name.trim()||!cf.email.trim()||!cf.password.trim()){setCfErr("All fields are required.");return;}
    if(cf.password.length<6){setCfErr("Password must be at least 6 characters.");return;}
    const err=await onAddClient(cf.name,cf.email,cf.password);
    if(err){setCfErr(err);return;}
    setCredmodal({name:cf.name,email:cf.email,password:cf.password});
    setCmodal(false);setCf({name:"",email:"",password:""});setCfErr("");
  };

  return(<div style={{minHeight:"100vh",background:"var(--bg)"}}>
    <header style={{background:"var(--nav)",padding:"0 28px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px rgba(0,0,0,.28)"}}>
      <div style={{maxWidth:"1200px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:"60px"}}>
        <div style={{display:"flex",alignItems:"center",gap:"12px"}}><span style={{fontFamily:"var(--ff)",fontSize:"18px",color:"#fff",fontWeight:400}}>{BRAND}</span><span className="adm">Admin</span></div>
        <button className="btn b-nav" onClick={onLogout} style={{padding:"6px 12px",fontSize:"12.5px"}}>Sign Out</button>
      </div>
    </header>
    <main style={{maxWidth:"1200px",margin:"0 auto",padding:"32px 28px"}}>
      <div style={{marginBottom:"22px"}}><h1 style={{fontFamily:"var(--ff)",fontSize:"28px",fontWeight:400,color:"var(--ink)",marginBottom:"4px"}}>Admin Dashboard</h1><p style={{fontSize:"13px",color:"var(--muted)"}}>Manage clients, events, and payments from one place.</p></div>

      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:"10px",marginBottom:"26px"}}>
        <SBox l="Total Events" v={counts.total}    bg="var(--panel)"   c="var(--ink)"/>
        <SBox l="Upcoming"    v={counts.upcoming}  bg="var(--gbg)"  c="var(--gold)"/>
        <SBox l="Confirmed"   v={counts.confirmed} bg="var(--gbg2)" c="var(--green)"/>
        <SBox l="Submitted"   v={counts.submitted} bg="var(--bbg)"  c="var(--blue)"/>
        <SBox l="Clients"     v={counts.clients}   bg="var(--pbg)"  c="var(--purple)"/>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"2px solid var(--border)",marginBottom:"22px",overflowX:"auto"}}>
        {[["calendar","Calendar"],["list","Events"],["clients","Clients"],["payments","Payments"]].map(([t,l])=>(
          <button key={t} className={`tab ${tab===t?"on":"off"}`} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* Calendar tab */}
      {tab==="calendar"&&<div className="card" style={{padding:"24px"}}><CalendarView events={allEvents} onSelect={onSelectEvent}/></div>}

      {/* Events list tab */}
      {tab==="list"&&<div>
        <div style={{display:"flex",gap:"10px",marginBottom:"14px",flexWrap:"wrap"}}>
          <input value={filter.search} onChange={e=>setFilter(f=>({...f,search:e.target.value}))} placeholder="Search events…" style={{flex:1,minWidth:"180px",maxWidth:"280px"}}/>
          <select value={filter.status} onChange={e=>setFilter(f=>({...f,status:e.target.value}))} style={{width:"150px"}}><option value="all">All Statuses</option><option value="draft">Draft</option><option value="submitted">Submitted</option><option value="confirmed">Confirmed</option></select>
          <select value={filter.type} onChange={e=>setFilter(f=>({...f,type:e.target.value}))} style={{width:"180px"}}><option value="all">All Event Types</option>{ET.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select>
          <select value={filter.uid} onChange={e=>setFilter(f=>({...f,uid:e.target.value}))} style={{width:"160px"}}><option value="all">All Clients</option>{profiles.map(p=><option key={p.id} value={p.id}>{p.name||p.email}</option>)}</select>
        </div>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"48px 24px",background:"var(--white)",borderRadius:"12px",border:"1.5px solid var(--border)",color:"var(--muted)"}}><p style={{fontSize:"15px",color:"var(--ink)"}}>No events match your filters.</p></div>
        ):(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.2fr 1fr 1fr 80px",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>
              {["Event","Client","Date","Venue","Status",""].map((h,i)=><div key={i} style={{fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:"var(--muted)"}}>{h}</div>)}
            </div>
            {filtered.map((ev,i)=>{const m2=meta(ev.eventType);const owner=profiles.find(p=>p.id===ev.userId);return(
              <div key={ev.id} style={{display:"grid",gridTemplateColumns:"2fr 1.5fr 1.2fr 1fr 1fr 80px",gap:"12px",padding:"13px 18px",borderBottom:i<filtered.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="var(--panel)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}
                onClick={()=>onSelectEvent(ev)}>
                <div style={{display:"flex",alignItems:"center",gap:"7px"}}><span style={{fontSize:"15px"}}>{m2.e}</span><div><div style={{fontSize:"13.5px",fontWeight:500,color:"var(--ink)"}}>{ev.eventName||"Unnamed"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{m2.label}</div></div></div>
                <div><div style={{fontSize:"13px",color:"var(--ink)"}}>{ev.clientName||owner?.name||"—"}</div><div style={{fontSize:"11px",color:"var(--muted)"}}>{ev.email||owner?.email||""}</div></div>
                <div style={{fontSize:"13px",color:"var(--body)"}}>{ev.eventDate?fShort(ev.eventDate):"—"}{ev.startTime&&<div style={{fontSize:"11px",color:"var(--muted)"}}>{f12(ev.startTime)}</div>}</div>
                <div style={{fontSize:"12.5px",color:"var(--body)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.venueName||"—"}{ev.venueCity&&<div style={{fontSize:"11px",color:"var(--muted)"}}>{ev.venueCity}</div>}</div>
                <div><span className={`badge st-${ev.status||"draft"}`}>{ev.status||"draft"}</span></div>
                <button className="btn b-gold" onClick={e=>{e.stopPropagation();onSelectEvent(ev);}} style={{padding:"5px 12px",fontSize:"12px"}}>Open</button>
              </div>
            );})}
          </div></div>
        )}
      </div>}

      {/* Clients tab */}
      {tab==="clients"&&<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
          <div><h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)",marginBottom:"2px"}}>Client Accounts</h3><p style={{fontSize:"13px",color:"var(--muted)"}}>Create accounts and send login credentials to clients.</p></div>
          <button className="btn b-gold" onClick={()=>{setCf({name:"",email:"",password:""});setCfErr("");setCmodal(true);}} style={{padding:"9px 20px"}}>+ Add Client</button>
        </div>
        {profiles.length===0?(
          <div style={{textAlign:"center",padding:"48px 24px",background:"var(--white)",borderRadius:"12px",border:"1.5px solid var(--border)",color:"var(--muted)"}}><p style={{fontFamily:"var(--ff)",fontSize:"18px",color:"var(--ink)",marginBottom:"6px"}}>No clients yet</p><button className="btn b-gold" onClick={()=>{setCf({name:"",email:"",password:""});setCfErr("");setCmodal(true);}}>Add First Client</button></div>
        ):(
          <div className="tbl-scroll" style={{background:"var(--white)",border:"1.5px solid var(--border)",borderRadius:"12px"}}><div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 2fr 80px 180px",gap:"12px",padding:"10px 18px",background:"var(--panel)",borderBottom:"1px solid var(--border)"}}>
              {["Name","Email","Events","Actions"].map(h=><div key={h} style={{fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:"var(--muted)"}}>{h}</div>)}
            </div>
            {profiles.map((p,i)=>(
              <div key={p.id} style={{display:"grid",gridTemplateColumns:"2fr 2fr 80px 180px",gap:"12px",padding:"13px 18px",borderBottom:i<profiles.length-1?"1px solid var(--border)":"none",alignItems:"center"}}>
                <div style={{fontWeight:500,color:"var(--ink)",fontSize:"13.5px"}}>{p.name||"—"}</div>
                <div style={{fontSize:"13px",color:"var(--body)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.email}</div>
                <div style={{fontSize:"13px",color:"var(--blue)",fontWeight:600}}>{allEvents.filter(e=>e.userId===p.id).length}</div>
                <div><button className="btn b-out" onClick={()=>setCredmodal({name:p.name||"Client",email:p.email,password:"(as set)"})} style={{padding:"5px 10px",fontSize:"11px"}}>Send Credentials</button></div>
              </div>
            ))}
          </div></div>
        )}
        {/* Add client modal */}
        {cmodal&&<Modal close={()=>setCmodal(false)} w={440}>
          <h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)",marginBottom:"16px"}}>Add New Client</h3>
          <ErrBox msg={cfErr}/>
          <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
            <div className="fg"><label className="lbl">Full Name</label><input value={cf.name} onChange={e=>setCf(f=>({...f,name:e.target.value}))} placeholder="Client's full name"/></div>
            <div className="fg"><label className="lbl">Email Address</label><input type="email" value={cf.email} onChange={e=>setCf(f=>({...f,email:e.target.value}))} placeholder="client@email.com"/></div>
            <div className="fg"><label className="lbl">Temporary Password</label><input type="text" value={cf.password} onChange={e=>setCf(f=>({...f,password:e.target.value}))} placeholder="Set a temporary password"/><p style={{fontSize:"11px",color:"var(--muted)",marginTop:"2px"}}>You'll share this with them — they can change it after logging in.</p></div>
            <div style={{display:"flex",gap:"10px",marginTop:"4px"}}><button className="btn b-out" onClick={()=>setCmodal(false)} style={{flex:1,justifyContent:"center"}}>Cancel</button><button className="btn b-gold" onClick={handleAddClient} style={{flex:1,justifyContent:"center"}}>Create Account</button></div>
          </div>
        </Modal>}
        {/* Credentials modal */}
        {credmodal&&<Modal close={()=>setCredmodal(null)} w={520}>
          <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"18px"}}><h3 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)"}}>Login Credentials</h3></div>
          <div style={{background:"var(--panel)",border:"1.5px solid var(--border)",borderRadius:"10px",padding:"16px 18px",marginBottom:"18px",fontFamily:"monospace",fontSize:"13px",color:"var(--ink)",lineHeight:1.9}}>
            <div><span style={{color:"var(--muted)"}}>Portal URL:</span> <strong>{PORTAL}</strong></div>
            <div><span style={{color:"var(--muted)"}}>Email:</span>      <strong>{credmodal.email}</strong></div>
            <div><span style={{color:"var(--muted)"}}>Password:</span>   <strong>{credmodal.password}</strong></div>
          </div>
          <p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"18px",lineHeight:1.6}}>Share these with <strong style={{color:"var(--ink)"}}>{credmodal.name}</strong> so they can log in and start planning their event.</p>
          <div style={{display:"flex",gap:"10px",flexWrap:"wrap"}}>
            <CopyBtn text={cText(credmodal.name,credmodal.email,credmodal.password)} label="Copy Message"/>
            <a href={`mailto:${credmodal.email}?subject=${encodeURIComponent(`Your ${BRAND} Login`)}&body=${encodeURIComponent(cText(credmodal.name,credmodal.email,credmodal.password))}`} className="btn b-gold" style={{textDecoration:"none"}}>Open in Email App</a>
            <button className="btn b-out" onClick={()=>setCredmodal(null)}>Done</button>
          </div>
        </Modal>}
      </div>}

      {/* Payments tab */}
      {tab==="payments"&&<div>
        <div style={{marginBottom:"22px"}}><h3 style={{fontFamily:"var(--ff)",fontSize:"20px",fontWeight:400,color:"var(--ink)",marginBottom:"4px"}}>Payment Methods</h3><p style={{fontSize:"13px",color:"var(--muted)"}}>Enable each method. Clients see payment links on their event page when you add a payment request.</p></div>
        <PayToggle id="venmo"   label="Venmo"    icon="💙" desc="Pre-filled Venmo payment link"          field="venmo"    placeholder="@YourVenmo"             lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="cashapp" label="Cash App" icon="💚" desc="Pre-filled Cash App payment link"       field="cashApp"  placeholder="$YourCashtag"           lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="zelle"   label="Zelle"    icon="💜" desc="Display Zelle info for transfer"        field="zelle"    placeholder="your@email.com or phone" lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        <PayToggle id="paypal"  label="PayPal"   icon="💙" desc="PayPal.me link for quick payments"      field="paypalMe" placeholder="YourPayPalHandle"       lps={lps} setLps={setLps} setPdirty={setPdirty}/>
        {pdirty&&<div style={{display:"flex",justifyContent:"flex-end",marginTop:"20px"}}>
          <button className="btn b-gold" disabled={psaving} onClick={async()=>{setPsaving(true);await onSavePaySettings(lps);setPdirty(false);setPsaving(false);}} style={{padding:"10px 28px"}}>
            {psaving?<span style={{animation:"pulse 1s infinite"}}>Saving…</span>:"Save Payment Settings"}
          </button>
        </div>}
      </div>}
    </main>
  </div>);}

// ════════════════════════════════════════════════
// ADMIN EVENT VIEW
// ════════════════════════════════════════════════
function AdminEventView({event,profiles,paySettings,payRequests,onSave,onAddPayReq,onUpdatePayReq,onBack}){
  const[status,setStatus]=useState(event.status||"draft");
  const[notes,setNotes]=useState(event.adminNotes||"");
  const[saved,setSaved]=useState(false);
  const[addingReq,setAddingReq]=useState(false);
  const[rf,setRf]=useState({amount:"",label:"",dueDate:""});
  const[showInvoice,setShowInvoice]=useState(false);
  const[showContract,setShowContract]=useState(false);
  const owner=profiles.find(p=>p.id===event.userId);
  const myReqs=(payRequests||[]).filter(r=>r.eventId===event.id);
  const ps=paySettings||BLANK_PAY;
  const m=meta(event.eventType);
  const gcal=gcalLink(event);

// GOOGLE CALENDAR LINK GENERATOR
// ════════════════════════════════════════════════
function gcalLink(event){
  if(!event.eventDate) return null;
  const pad = n => String(n).padStart(2,"0");
  const dateStr = event.eventDate.replace(/-/g,"");
  let start, end;
  if(event.startTime){
    const [sh,sm]=event.startTime.split(":");
    start=`${dateStr}T${pad(sh)}${pad(sm)}00`;
    if(event.endTime){
      const [eh,em]=event.endTime.split(":");
      end=`${dateStr}T${pad(eh)}${pad(em)}00`;
    } else {
      // default 4 hours
      const eh=(parseInt(sh)+4)%24;
      end=`${dateStr}T${pad(eh)}${pad(sm)}00`;
    }
  } else {
    start=dateStr; end=dateStr;
  }
  const loc=encodeURIComponent([event.venueName,event.venueAddress,event.venueCity,event.venueState].filter(Boolean).join(", "));
  const title=encodeURIComponent(event.eventName||"Event");
  const details=encodeURIComponent(`Client: ${event.clientName}\nPhone: ${event.phone}\nEmail: ${event.email}\nGuests: ${event.guestCount||"TBD"}`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&location=${loc}&details=${details}`;
}
