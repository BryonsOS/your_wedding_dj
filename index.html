          {/* Agreement */}
          <p style={{marginBottom:"16px"}}>Agreement made between <strong>{brand.name}</strong> and:</p>
          <div style={{background:"#f7f8fb",border:"1.5px solid #dde1eb",borderRadius:"8px",padding:"16px",marginBottom:"20px",lineHeight:2}}>
            <div><strong>{event.clientName||"___________________"}</strong></div>
            <div style={{color:"#6a7090"}}>{event.address||"___________________"}</div>
            <div style={{color:"#6a7090"}}>{event.phone||""}{event.email&&` | ${event.email}`}</div>
          </div>

          <p style={{marginBottom:"20px"}}>To provide services for the above client on the date of <strong>{event.eventDate||"________"}</strong> between the hours of <strong>{event.startTime?f12(event.startTime):"______"}</strong> to <strong>{event.endTime?f12(event.endTime):"______"}</strong> for a <strong>{meta(event.eventType).label}</strong> to be held at <strong>{event.venueName||"________________"}</strong> located in <strong>{[event.venueCity,event.venueState].filter(Boolean).join(", ")||"________"}</strong>.</p>

          <p style={{marginBottom:"24px",fontWeight:600,fontSize:"14px",color:"#b52b2b"}}>Required contract signing payment (non-refundable deposit): ${deposit.toFixed(2)}</p>

          {/* Pricing table */}
          <table style={{width:"100%",borderCollapse:"collapse",marginBottom:"24px",fontSize:"13px"}}>
            <thead><tr style={{background:"#111111"}}><th style={{padding:"10px 14px",textAlign:"left",color:"#fff",fontWeight:600}}>Description</th><th style={{padding:"10px 14px",textAlign:"right",color:"#fff",fontWeight:600}}>Amount</th></tr></thead>
            <tbody>
              {reqs.map((r,i)=>(
                <tr key={r.id} style={{borderBottom:"1px solid #dde1eb",background:i%2===0?"#f7f8fb":"#fff"}}>
                  <td style={{padding:"10px 14px"}}>{r.label}</td>
                  <td style={{padding:"10px 14px",textAlign:"right",fontWeight:600}}>${parseFloat(r.amount||0).toFixed(2)}</td>
                </tr>
              ))}
              {reqs.length===0&&<tr><td style={{padding:"10px 14px",color:"#9fa4bc",fontStyle:"italic"}}>Services</td><td style={{padding:"10px 14px",textAlign:"right"}}>$0.00</td></tr>}
            </tbody>
            <tfoot>
              <tr style={{borderTop:"2px solid #111111"}}><td style={{padding:"10px 14px",fontWeight:700}}>Total</td><td style={{padding:"10px 14px",textAlign:"right",fontWeight:700,fontSize:"15px"}}>${total.toFixed(2)}</td></tr>
              <tr><td style={{padding:"6px 14px",color:"#6a7090"}}>Contract Signing Payment (Deposit)</td><td style={{padding:"6px 14px",textAlign:"right",color:"#6a7090"}}>-${deposit.toFixed(2)}</td></tr>
              <tr style={{background:"#eaf7f0"}}><td style={{padding:"10px 14px",fontWeight:700,color:"#157a42"}}>Balance Due on Day of Event</td><td style={{padding:"10px 14px",textAlign:"right",fontWeight:700,color:"#157a42"}}>${Math.max(0,total-deposit).toFixed(2)}</td></tr>
            </tfoot>
          </table>

          {/* Terms */}
          <div style={{marginBottom:"24px"}}>
            <h2 style={{fontSize:"14px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",marginBottom:"16px",color:"#111111",paddingBottom:"8px",borderBottom:"2px solid #111111"}}>TERMS AND CONDITIONS</h2>

            {[
              ["1. General Provisions",""],
              ["1.1","The services to be provided by "+brand.name+" are specifically for the event type specified and none other. If the event type is other than specified, "+brand.name+" reserves the right to terminate performance."],
              ["1.2","The date of the event is not reserved until this Booking Contract or a Retainer Agreement is returned with the contract signing fee to "+brand.name+". The client will be informed if others are interested in the date of the event specified in this Booking Contract."],
              ["1.3",brand.name+" shall be excused by detention of personnel by sickness, accidents, riots, strikes, epidemics, Acts of God, Force Major, Acts of War or any other legitimate condition beyond "+brand.name+"'s control. If such circumstances arise, all reasonable efforts shall be made by "+brand.name+" to find a replacement entertainment at the agreed upon fees. Should "+brand.name+" be unable to procure a replacement, the client shall receive a 110% refund of all fees paid. The client agrees that "+brand.name+"'s liability shall be exclusively limited to refunding 110% of the fees paid."],
              ["1.4",brand.name+" shall be ready to perform at the start time of the event. "+brand.name+" requests at least 90 minutes before the event and at least 90 minutes after the event for setup and take down."],
              ["1.5","This agreement shall be governed by the laws of the State of Michigan. In the event of suit, the client agrees that suit shall be in Kent County."],
              ["1.6","Except for negligent acts by "+brand.name+" personnel, the client agrees to defend, indemnify, assume liability for and hold "+brand.name+" harmless from any claims, damages, losses and expenses which pertains directly or indirectly to "+brand.name+"'s performance."],
              ["1.7","In the event that a civil action arises in an effort to enforce any provision of this agreement, the losing party shall pay the attorney's fee and court costs of the prevailing party."],
              ["1.8","The client may not transfer this Event Booking Contract to another party without the prior written consent of "+brand.name+"."],
              ["1.9","This Event Booking Contract is not binding until received and signed by an authorized representative of "+brand.name+". Any changes must be written and signed by both parties. Oral agreements are non-binding."],
              ["1.10","If any clause in this agreement is found to be illegal, the rest of the agreement shall remain in force."],
              ["1.11",brand.name+" may elect not to exercise their rights as specified in this agreement without waiving the right to exercise those options at a future date."],
              ["1.12",brand.name+" is acting as a subcontractor to the client and not as an employee of the client."],
              ["2. Fees",""],
              ["2.1","Amount for services: This is the total price of the contract."],
              ["2.2","Contract Signing Payment: This is the non-refundable fee paid to "+brand.name+" to secure the services for the date being booked. This amount is subtracted from the total amount for services."],
              ["2.3","Balance: The amount remaining after subtracting the Contract Signing Payment and any other portion paid."],
              ["2.4",brand.name+" reserves the right to seek legal means to recover the remaining balance of the total amount for services and any court and legal fees resulting from such legal means."],
              ["2.5","The client may pay the remaining balance on the day of the event. The remaining balance must be paid by cash, bank (cashier's) check, or money order and must be paid prior to "+brand.name+" staff setting equipment up. If the remaining balance has not been paid 15 minutes after the scheduled start of the event, "+brand.name+" staff will leave the venue and the client will still be responsible for paying the remaining balance."],
              ["2.6","There will be a $100 fee added for all returned checks."],
              ["3. Play List",""],
              ["3.1",brand.name+" must receive a written event/music planner or music request list at least 7 days prior to the event for it to be included in programming guidelines."],
              ["3.2","The written event/music planner or music request list shall include a 'Do Not Play' list."],
              ["3.3","With or without the aid of an event/music planner, "+brand.name+" shall attempt to play the client's and the client's guests' music requests but shall not be held responsible if certain selections are unavailable."],
              ["3.4",brand.name+" shall make an extra effort to have music requests available if received IN WRITING at least 7 days prior to the event. Use of "+brand.name+"'s online music selection system shall be considered 'IN WRITING.'"],
              ["3.5",brand.name+" reserves the right to include selections in addition to or substitution of those specified by the client in order to increase dance participation. None of these additional selections shall be on the client's Do Not Play list."],
              ["3.6","In order to present songs in an appropriate manner, "+brand.name+" reserves the right to modify the order of songs presented on the event/music planner or music request list."],
              ["4. Venue Access",""],
              ["4.1","The client and their agents are to provide "+brand.name+" immediate, unencumbered, and non-hazardous access into, through and out of the loading area, facility, and work space."],
              ["4.2",brand.name+" requires ramp or elevator access between the parking/service entrance and the setup area. If the only access is via steps, "+brand.name+" reserves the right to charge an additional $10/step for 3 or more steps. "+brand.name+" must be notified of steps being the only access method prior to signing."],
              ["4.3","The client is responsible for paying any charges imposed by the venue including parking, use of electric power, and overtime."],
              ["5. Working Conditions","The client shall provide "+brand.name+" with safe and appropriate working conditions including:"],
              ["5.1","A 6 foot by 6 foot area for the DJ's main setup and space for speakers."],
              ["5.2","A 120-volt outlet (3-prong grounded with at least 15 amps available) from a reliable power source within 50 feet of the set-up area."],
              ["5.3","A facility that completely covers and protects "+brand.name+"'s equipment from adverse weather conditions."],
              ["5.4","Providing crowd control if warranted; and furnishing directions and free parking."],
              ["5.5","For outdoor events, the client shall provide a dry area. If the ground is soft, the client shall place plywood in a 6x6 foot area for "+brand.name+". The client accepts full responsibility for any damages, injuries or delays from failure to comply."],
              ["6. Safety of Personnel",""],
              ["6.1","The client shall take steps to protect "+brand.name+"'s equipment and personnel during the contracted period. Any damages incurred due to a lack of reasonable protection shall be payable by the client to the extent of repair or replacement."],
              ["6.2","In the event of circumstances deemed by "+brand.name+" to present a threat of injury or harm, "+brand.name+" reserves the right to cease performance. The client shall be responsible for payment in full regardless of whether the situation is resolved."],
              ["6.3",brand.name+" reserves the right to deny any guest access to the sound system, music recordings, or other equipment."],
              ["7. Cancellation",""],
              ["7.1","This agreement cannot be canceled except by mutual written consent of both the client and "+brand.name+"."],
              ["7.2","If cancellation is initiated by the client in writing and agreed to by "+brand.name+" in writing, the client shall be required to pay any unrecoverable costs already incurred."],
              ["7.3","Up to 45 days prior to the event: "+brand.name+" is entitled to the Contract Signing Payment ($200.00)."],
              ["7.4","Between 30 days and 45 days prior to the event: "+brand.name+" is entitled to 75% of the amount for services."],
              ["7.5","If the event is cancelled 30 days or less from the date of the event, "+brand.name+" is entitled to 100% of the amount for services."],
              ["8. Photo Montages",""],
              ["8.1","All materials for photo montages are due into "+brand.name+" 15 days prior to the event."],
              ["8.2","A $50 late fee will be assessed for materials received after 15 days prior to the event."],
              ["8.3","Do not send materials later than 10 days prior to the event as there will not be enough time to develop the montage."],
              ["9. Song Content","Due to the nature of current music, "+brand.name+" is not responsible for foul or abusive content in songs or singers' comments on microphones. Standard non-karaoke music is all radio versions or censored. If requested, "+brand.name+" will make 2 announcements about use of language but cannot police the entire evening."],
            ].map(([num,text],i)=>{
              const isHeader=text===""||num.split(".").length===1;
              if(isHeader&&text==="") return <p key={i} style={{fontWeight:700,marginTop:"16px",marginBottom:"6px",color:"#111111",fontSize:"13.5px"}}>{num}</p>;
              return <p key={i} style={{marginBottom:"8px",paddingLeft:isHeader?"0":"0"}}><strong>{num}.</strong> {text}</p>;
            })}
          </div>

          <p style={{marginBottom:"24px",fontStyle:"italic",color:"#6a7090",fontSize:"12px"}}>This contract may not be altered, cancelled, assigned, or transferred without the consent and authorization of {brand.name}. If unauthorized changes are made, {brand.name} reserves the right to void the contract and withhold the contract signing fee.</p>

          {/* Signature lines */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"32px",marginTop:"32px",paddingTop:"24px",borderTop:"2px solid #dde1eb"}}>
            <div>
              <div style={{marginBottom:"16px"}}>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>{brand.name} Representative</label>
                <input value={dmSig} onChange={e=>setDmSig(e.target.value)} placeholder="Authorized signature" style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"15px",fontFamily:"'Playfair Display',Georgia,serif",fontStyle:"italic"}}/>
              </div>
              <div>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Date</label>
                <input value={dmDate} onChange={e=>setDmDate(e.target.value)} placeholder={today} style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"14px"}}/>
              </div>
            </div>
            <div>
              <div style={{marginBottom:"16px"}}>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Client Signature</label>
                <input value={clientSig} onChange={e=>setClientSig(e.target.value)} placeholder="Client full name" style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"15px",fontFamily:"'Playfair Display',Georgia,serif",fontStyle:"italic"}}/>
              </div>
              <div>
                <label style={{display:"block",fontSize:"11px",fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"#111111",marginBottom:"6px"}}>Date</label>
                <input value={clientDate} onChange={e=>setClientDate(e.target.value)} placeholder={today} style={{borderTop:"none",borderLeft:"none",borderRight:"none",borderBottom:"2px solid #1a1d2e",borderRadius:0,padding:"8px 0",fontSize:"14px"}}/>
              </div>
            </div>
          </div>
        </div>
      </div>
      <style>{`@media print { body * { visibility: hidden; } #contract-print, #contract-print * { visibility: visible; } #contract-print { position: fixed; top: 0; left: 0; width: 100%; padding: 32px; font-size: 11px; } #contract-print input { border: none !important; outline: none !important; } }`}</style>
    </div>
  );
}

// ════════════════════════════════════════════════
// ROOT APP
// ════════════════════════════════════════════════
function App(){
  const[user,setUser]     =useState(null);
  const[loading,setLoad]  =useState(true);
  const[screen,setScreen] =useState("auth");
  const[events,setEvents] =useState([]);
  const[allEvs,setAllEvs] =useState([]);
  const[profiles,setProfs]=useState([]);
  const[paySet,setPaySet] =useState(BLANK_PAY);
  const[payReqs,setPayReqs]=useState([]);
  const[selId,setSelId]   =useState(null);

  // ── Load session on mount ────────────────────
  useEffect(()=>{
    (async()=>{
      // Detect Supabase password-recovery redirect (URL contains #type=recovery)
      const hash = window.location.hash || "";
      if(hash.includes("type=recovery")){
        // Supabase sets the session automatically from the hash; wait briefly
        await new Promise(r=>setTimeout(r,400));
        setLoad(false);
        setScreen("reset");
        // Clean the hash from the URL bar without reload
        history.replaceState(null,"",window.location.pathname+window.location.search);
        return;
      }
      const{data:{session}}=await DB.auth.getSession();
      if(session){
        const{data:prof}=await DB.from("dj_profiles").select("*").eq("id",session.user.id).single();
        const u={...session.user,...(prof||{})};
        setUser(u);
        await loadUserData(u);
      }
      setLoad(false);
    })();
  },[]);

  const loadUserData=async u=>{
    // Load payment settings (all users need to see payment methods)
    const{data:ps}=await DB.from("dj_payment_settings").select("*").order("updated_at",{ascending:false}).limit(1).single();
    if(ps){setPaySet({venmo:ps.venmo||"",cashApp:ps.cash_app||"",zelle:ps.zelle||"",paypalMe:ps.paypal_me||"",methods:ps.methods||{}});}else{setPaySet(BLANK_PAY);}

    if(u.is_admin){
      const{data:evs}=await DB.from("dj_events").select("*").order("event_date",{ascending:true,nullsFirst:false});
      setAllEvs((evs||[]).map(fromRow));
      const{data:profs}=await DB.from("dj_profiles").select("*").order("created_at",{ascending:false});
      setProfs(profs||[]);
      const{data:pr}=await DB.from("dj_payment_requests").select("*");
      setPayReqs(pr||[]);
      setScreen("admin");
    } else {
      const{data:evs}=await DB.from("dj_events").select("*").eq("user_id",u.id).order("updated_at",{ascending:false});
      setEvents((evs||[]).map(fromRow));
      const{data:pr}=await DB.from("dj_payment_requests").select("*");
      setPayReqs(pr||[]);
      setScreen("dash");
    }
  };

  const handleLogin=async u=>{setUser(u);await loadUserData(u);};
  const handleLogout=async()=>{await DB.auth.signOut();setUser(null);setEvents([]);setScreen("auth");};

  const handleSaveEvent=async ev=>{
    const{data,error}=await DB.from("dj_events").upsert(toRow(ev),{onConflict:"id"}).select().single();
    if(!error&&data){
      const mapped=fromRow(data);
      setEvents(p=>p.some(e=>e.id===mapped.id)?p.map(e=>e.id===mapped.id?mapped:e):[...p,mapped]);
      if(user?.is_admin)setAllEvs(p=>p.some(e=>e.id===mapped.id)?p.map(e=>e.id===mapped.id?mapped:e):[...p,mapped]);
      setSelId(mapped.id);
      setScreen(user?.is_admin?"admin_view":"view");
    }
  };

  const handleDelete=async id=>{await DB.from("dj_events").delete().eq("id",id);setEvents(p=>p.filter(e=>e.id!==id));};
  const handleAdminSave=async ev=>{const{data}=await DB.from("dj_events").upsert(toRow(ev),{onConflict:"id"}).select().single();if(data){const m=fromRow(data);setAllEvs(p=>p.map(e=>e.id===m.id?m:e));}};
  const handleSavePaySettings=async s=>{await DB.from("dj_payment_settings").upsert({id:"00000000-0000-0000-0000-000000000001",venmo:s.venmo||"",cash_app:s.cashApp||"",zelle:s.zelle||"",paypal_me:s.paypalMe||"",methods:s.methods||{}},{onConflict:"id"});setPaySet(s);};

  const handleAddClient=async(name,email,password)=>{
    const{data,error}=await DB.auth.signUp({email,password,options:{data:{name}}});
    if(error)return error.message;
    const{data:profs}=await DB.from("dj_profiles").select("*").order("created_at",{ascending:false});
    setProfs(profs||[]);
    return null;
  };

  const handleAddPayReq=async req=>{
    await DB.from("dj_payment_requests").insert({id:req.id,event_id:req.eventId,amount:req.amount,label:req.label,due_date:req.dueDate||null,status:req.status});
    const{data:pr}=await DB.from("dj_payment_requests").select("*");setPayReqs(pr||[]);
  };
  const handleUpdatePayReq=async req=>{
    if(req._delete){await DB.from("dj_payment_requests").delete().eq("id",req.id);}
    else{await DB.from("dj_payment_requests").update({status:req.status}).eq("id",req.id);}
    const{data:pr}=await DB.from("dj_payment_requests").select("*");setPayReqs(pr||[]);
  };

  // Map payment requests to camelCase
  const pReqs=payReqs.map(r=>({id:r.id,eventId:r.event_id,amount:r.amount,label:r.label,dueDate:r.due_date,status:r.status}));
  const sel=events.find(e=>e.id===selId)||allEvs.find(e=>e.id===selId)||null;

  if(!CONFIGURED) return(
    <div style={{minHeight:"100vh",background:"var(--nav)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{maxWidth:"480px",width:"100%"}}>
        <div style={{textAlign:"center",marginBottom:"32px"}}>
          <div style={{fontSize:"48px",marginBottom:"16px"}}>🎵</div>
          <h1 style={{fontFamily:"var(--ff)",fontSize:"32px",fontWeight:400,color:"#fff",marginBottom:"8px"}}>{BRAND}</h1>
          <p style={{fontSize:"14px",color:"rgba(255,255,255,.5)"}}>Setup Required</p>
        </div>
        <div style={{background:"var(--white)",borderRadius:"12px",padding:"32px"}}>
          <h2 style={{fontFamily:"var(--ff)",fontSize:"22px",fontWeight:400,color:"var(--ink)",marginBottom:"16px"}}>⚙️ Add Your Supabase Keys</h2>
          <p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"20px",lineHeight:1.7}}>Open <strong>dj-planner.html</strong> in Notepad and fill in the 3 lines at the very top of the file:</p>
          <div style={{background:"var(--panel)",border:"1.5px solid var(--border)",borderRadius:"8px",padding:"16px",fontFamily:"monospace",fontSize:"13px",color:"var(--ink)",lineHeight:2,marginBottom:"20px"}}>
            <div><span style={{color:"var(--muted)"}}>const SB_URL  =</span> <strong style={{color:"var(--blue)"}}>"https://xxxx.supabase.co"</strong></div>
            <div><span style={{color:"var(--muted)"}}>const SB_ANON =</span> <strong style={{color:"var(--blue)"}}>"eyJhbGci..."</strong></div>
            <div><span style={{color:"var(--muted)"}}>const PORTAL  =</span> <strong style={{color:"var(--blue)"}}>"https://yoursite.com"</strong></div>
          </div>
          <p style={{fontSize:"13px",color:"var(--muted)",lineHeight:1.7}}>Get your keys from:<br/><strong style={{color:"var(--ink)"}}>Supabase Dashboard → Project Settings → API</strong></p>
          <div style={{marginTop:"20px",padding:"12px 14px",background:"var(--gbg)",border:"1.5px solid var(--gbdr)",borderRadius:"8px",fontSize:"12px",color:"var(--body)"}}>
            After editing, save the file and refresh this page.
          </div>
        </div>
      </div>
    </div>
  );

  if(loading) return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
      <div style={{textAlign:"center"}}><div className="spin" style={{margin:"0 auto 16px"}}/><p style={{fontSize:"13px",color:"var(--muted)"}}>Loading…</p></div>
    </div>
  );

  const handleResetDone = async () => {
    // After password update, Supabase already has a session — load it
    const{data:{session}}=await DB.auth.getSession();
    if(session){
      const{data:prof}=await DB.from("dj_profiles").select("*").eq("id",session.user.id).single();
      const u={...session.user,...(prof||{})};
      setUser(u);
      await loadUserData(u);
    } else {
      setScreen("auth");
    }
  };

  return(<>
    {screen==="auth"       && <Auth onLogin={handleLogin}/>}
    {screen==="reset"      && <ResetPassword onDone={handleResetDone}/>}
    {screen==="dash"       && <Dashboard user={user} events={events} onNew={()=>{setSelId(null);setScreen("new");}} onView={id=>{setSelId(id);setScreen("view");}} onEdit={id=>{setSelId(id);setScreen("edit");}} onDelete={handleDelete} onLogout={handleLogout}/>}
    {screen==="new"        && <EventForm event={null} userId={user?.id} onSave={handleSaveEvent} onCancel={()=>setScreen("dash")}/>}
    {screen==="edit"       && <EventForm event={sel} userId={user?.id} onSave={handleSaveEvent} onCancel={()=>setScreen("view")}/>}
    {screen==="view"       && <EventView event={sel} paySettings={paySet} payRequests={pReqs} onEdit={()=>setScreen("edit")} onBack={()=>setScreen("dash")}/>}
    {screen==="admin"      && <AdminDashboard allEvents={allEvs} profiles={profiles} paySettings={paySet} payRequests={pReqs} onSelectEvent={ev=>{setSelId(ev.id);setScreen("admin_view");}} onSavePaySettings={handleSavePaySettings} onAddClient={handleAddClient} onLogout={handleLogout}/>}
    {screen==="admin_view" && <AdminEventView event={sel} profiles={profiles} paySettings={paySet} payRequests={pReqs} onSave={handleAdminSave} onAddPayReq={handleAddPayReq} onUpdatePayReq={handleUpdatePayReq} onBack={()=>setScreen("admin")}/>}
  </>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
